    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),

  background-position:

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;

  margin: 0;
  padding: 0;

  border: 0;

.form-range::-moz-range-track {

  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

.nav-link:focus-visible {

&lt;body&gt;
&lt;div id=&quot;story&quot; class=&quot;story&quot; aria-roledescription=&quot;slide deck&quot; aria-label=&quot;Gibbs energy in practice: predicting and preventing corrosion&quot;&gt;
  &lt;div class=&quot;story-progress&quot; role=&quot;presentation&quot; id=&quot;story-progress&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;story-viewport&quot;&gt;
    &lt;div class=&quot;story-track&quot; id=&quot;story-track&quot;&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;0&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;A trillion-dollar chemistry problem&lt;/p&gt;
        &lt;h2&gt;Why does a $276-billion-a-year problem have a two-line thermodynamic answer?&lt;/h2&gt;
        &lt;p class=&quot;story-lede&quot;&gt;Corrosion costs the United States alone an estimated &lt;strong&gt;$276 billion a year&lt;/strong&gt; &amp;mdash; 3.1% of GDP &amp;mdash; largely because, left alone, iron and steel simply do what thermodynamics says they should. The same equation, &amp;Delta;G = &amp;Delta;H &amp;minus; T&amp;Delta;S, both explains why metals corrode and, when engineers calculate it for candidate alloys, predicts how to stop them.&lt;/p&gt;
        &lt;p class=&quot;story-source&quot;&gt;Sources: peer-reviewed &amp;mdash; Koch et al., NACE/FHWA Cost of Corrosion Study (2002); Huang et al., &lt;em&gt;npj Materials Degradation&lt;/em&gt; (2023)&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;1&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;The Gibbs energy equation&lt;/p&gt;
        &lt;h2&gt;&amp;Delta;G = &amp;Delta;H &amp;minus; T&amp;Delta;S&lt;/h2&gt;
        &lt;p&gt;The process in question: does a bare metal surface stay as metal, or does it react with its environment &amp;mdash; oxygen, water, acid &amp;mdash; to form an oxide or hydroxide? That&#x27;s corrosion.&lt;/p&gt;
        &lt;div class=&quot;story-callout story-callout-theory&quot;&gt;
          &lt;p class=&quot;story-callout-label&quot;&gt;The reaction&lt;/p&gt;
          &lt;p class=&quot;story-equation&quot;&gt;Fe(s) &amp;#8652; Fe&lt;sup&gt;2+&lt;/sup&gt;(aq) + 2e&amp;minus;&lt;/p&gt;
          &lt;p class=&quot;story-callout-text&quot;&gt;&amp;Delta;G for the overall corrosion cell reaction tells you which way this arrow runs, and how strongly.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;2&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Why this equation? &amp;middot; 1 of 2&lt;/p&gt;
        &lt;h2&gt;Corrosion is just an electrochemical reaction &amp;mdash; and &amp;Delta;G is what tells you if it runs&lt;/h2&gt;
        &lt;p&gt;Any metal exposed to an oxidizer is one spontaneous redox reaction away from dissolving &amp;mdash; the same &amp;Delta;G logic that drives a battery, just one nobody wants running.&lt;/p&gt;
        &lt;p class=&quot;story-see-also&quot;&gt;See also, in this collection: the interactive Gibbs energy and Nernst equation explorers.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;3&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Why this equation? &amp;middot; 2 of 2&lt;/p&gt;
        &lt;h2&gt;Standard electrode potentials turn a lookup table into a prediction&lt;/h2&gt;
        &lt;p&gt;&amp;Delta;G&amp;deg; = &amp;minus;&lt;em&gt;nFE&lt;/em&gt;&amp;deg;. Chemists have tabulated standard reduction potentials for essentially every relevant half-reaction, so predicting whether a metal corrodes in a given environment doesn&#x27;t need a new experiment &amp;mdash; just two numbers from a table and arithmetic.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;4&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;The data&lt;/p&gt;
        &lt;h2&gt;Two half-reactions, read straight from a standard table&lt;/h2&gt;
        &lt;ul class=&quot;story-list&quot;&gt;
          &lt;li&gt;Fe&lt;sup&gt;2+&lt;/sup&gt;(aq) + 2e&amp;minus; &amp;rarr; Fe(s), &lt;em&gt;E&lt;/em&gt;&amp;deg; = &amp;minus;0.44 V &amp;mdash; iron &quot;wants&quot; to give up electrons&lt;/li&gt;
          &lt;li&gt;O&lt;sub&gt;2&lt;/sub&gt;(g) + 2H&lt;sub&gt;2&lt;/sub&gt;O(l) + 4e&amp;minus; &amp;rarr; 4OH&amp;minus;(aq), &lt;em&gt;E&lt;/em&gt;&amp;deg; = +0.40 V &amp;mdash; dissolved oxygen &quot;wants&quot; to take them&lt;/li&gt;
          &lt;li&gt;Faraday constant, &lt;em&gt;F&lt;/em&gt; = 96,485 C mol&amp;#8315;&amp;sup1; &amp;mdash; converts electrical potential into chemical energy&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;5&quot; data-chart=&quot;e-ph&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Results &amp;middot; step 1&lt;/p&gt;
        &lt;h2&gt;Iron&#x27;s potential sits below water&#x27;s entire stability window&lt;/h2&gt;
        &lt;p&gt;These are the real Nernst-derived lines, not a sketch, shown for pH 0&amp;ndash;7. Iron&#x27;s reduction potential sits below both boundaries of the region where water itself is stable &amp;mdash; so water and dissolved oxygen can, in principle, always oxidize it.&lt;/p&gt;
        &lt;div class=&quot;story-chart-wrap&quot;&gt;&lt;svg id=&quot;chart-e-ph&quot; role=&quot;img&quot; aria-labelledby=&quot;e-ph-title e-ph-desc&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
        &lt;p class=&quot;story-caption&quot;&gt;Simplified for pH 0&amp;ndash;7; iron-hydroxide equilibria add further structure at higher pH, not shown here.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;6&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Results &amp;middot; step 2&lt;/p&gt;
        &lt;h2&gt;Turning two tabulated potentials into one energy number&lt;/h2&gt;
        &lt;p&gt;&lt;em&gt;E&lt;/em&gt;&amp;deg;&lt;sub&gt;cell&lt;/sub&gt; = &lt;em&gt;E&lt;/em&gt;&amp;deg;&lt;sub&gt;cathode&lt;/sub&gt; &amp;minus; &lt;em&gt;E&lt;/em&gt;&amp;deg;&lt;sub&gt;anode&lt;/sub&gt; = 0.40 &amp;minus; (&amp;minus;0.44) = +0.84 V, for 2Fe + O&lt;sub&gt;2&lt;/sub&gt; + 2H&lt;sub&gt;2&lt;/sub&gt;O &amp;rarr; 2Fe(OH)&lt;sub&gt;2&lt;/sub&gt;.&lt;/p&gt;
        &lt;div class=&quot;story-stat-row&quot;&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;+0.84&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;V&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;&lt;em&gt;E&lt;/em&gt;&amp;deg;&lt;sub&gt;cell&lt;/sub&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;4&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;mol e&amp;minus;&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;&lt;em&gt;n&lt;/em&gt; transferred&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;&amp;minus;324&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;kJ&amp;nbsp;mol&amp;#8315;&amp;sup1; &lt;span class=&quot;story-stat-alt&quot;&gt;(&amp;minus;162 kJ&amp;nbsp;mol&amp;#8315;&amp;sup1; Fe)&lt;/span&gt;&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;&amp;Delta;G&amp;deg; = &amp;minus;&lt;em&gt;nFE&lt;/em&gt;&amp;deg;&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;story-note&quot;&gt;Computed directly from standard tabulated reduction potentials &amp;mdash; the same calculation engineers run for any candidate metal/environment pair.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;7&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;One missing piece&lt;/p&gt;
        &lt;h2&gt;A hugely negative &amp;Delta;G doesn&#x27;t mean &quot;instant&quot; &amp;mdash; kinetics still decides how fast&lt;/h2&gt;
        &lt;p&gt;&amp;Delta;G&amp;deg; says corrosion is thermodynamically favorable here, not how quickly it proceeds. Aluminium, chromium and titanium have an even more negative &amp;Delta;G of oxidation, yet barely corrode in practice &amp;mdash; because the oxide that forms is a dense, adherent, self-healing film rather than porous rust. That film&#x27;s own stability is itself a Gibbs energy question.&lt;/p&gt;
        &lt;p class=&quot;story-see-also&quot;&gt;See also, in this collection: the Arrhenius equation and rate laws explorers.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;8&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;The real engineering decision&lt;/p&gt;
        &lt;h2&gt;Which oxide actually sticks? Designing an alloy by its Gibbs energy&lt;/h2&gt;
        &lt;p&gt;Chromium&#x27;s own &amp;Delta;G of oxidation is strongly negative &amp;mdash; but the resulting Cr&lt;sub&gt;2&lt;/sub&gt;O&lt;sub&gt;3&lt;/sub&gt; film is thin, dense and self-healing, reforming instantly if scratched, unlike iron&#x27;s flaking rust. This is exactly how stainless steel works. Alloy engineers can now choose how much chromium to add using Gibbs-energy calculations directly, not trial and error.&lt;/p&gt;
        &lt;div class=&quot;story-callout story-callout-data&quot;&gt;
          &lt;p class=&quot;story-callout-label&quot;&gt;Method&lt;/p&gt;
          &lt;p class=&quot;story-callout-text&quot;&gt;Huang et al. (2023) computed ab-initio free energies of formation (&amp;Delta;&lt;sub&gt;f&lt;/sub&gt;&lt;em&gt;G&lt;/em&gt;) for the competing oxide and hydroxide phases on nickel&amp;ndash;chromium alloys, across a range of chromium content and temperature, then built the resulting potential&amp;ndash;pH (Pourbaix-style) stability diagrams.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;9&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Results &amp;middot; step 3&lt;/p&gt;
        &lt;h2&gt;A design window computed, not guessed&lt;/h2&gt;
        &lt;div class=&quot;story-stat-row&quot;&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;14&amp;ndash;34&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;at% Cr&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;Optimal chromium content range&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;story-note&quot;&gt;Balances corrosion resistance against heat-treatment stability, derived from the calculated Gibbs energies of formation of the competing oxide/hydroxide phases on Ni&amp;ndash;Cr alloys. Source: Huang, Chen, Erhart &amp;amp; Liu, &lt;em&gt;npj Materials Degradation&lt;/em&gt; 7, 2023.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;10&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Why this matters&lt;/p&gt;
        &lt;h2&gt;A chemistry equation, not guesswork, behind a 3.1%-of-GDP problem&lt;/h2&gt;
        &lt;p&gt;The direct cost of corrosion in the United States alone was estimated at $276 billion a year, about 3.1% of GDP, with indirect costs plausibly doubling that (Koch et al., 2002). Every alloy, coating, or inhibitor that substitutes a thermodynamically-informed design choice for trial and error chips away at that number &amp;mdash; the same &amp;Delta;G = &amp;Delta;H &amp;minus; T&amp;Delta;S used to explain why plain iron rusts.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;11&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;The takeaway&lt;/p&gt;
        &lt;h2&gt;One equation, a standard-potential table, a modern alloy-design calculation&lt;/h2&gt;
        &lt;p&gt;This is what the Gibbs energy equation is for outside the classroom: the same relationship that explains why a nail rusts in the rain also tells materials engineers, in advance and without building a single test alloy, roughly how much chromium a new steel needs to resist it.&lt;/p&gt;
        &lt;p class=&quot;story-see-also&quot;&gt;See also, in this collection: the interactive Gibbs energy and Nernst equation explorers.&lt;/p&gt;
        &lt;div class=&quot;story-citation&quot;&gt;
          &lt;p&gt;Koch, G.H.; Brongers, M.P.H.; Thompson, N.G.; Virmani, Y.P.; Payer, J.H. Corrosion Cost and Preventive Strategies in the United States. &lt;strong&gt;2002&lt;/strong&gt;.&lt;/p&gt;
          &lt;p&gt;Huang, L.; Chen, D.; Erhart, P.; Liu, F. Elemental partitioning and corrosion resistance of Ni&amp;ndash;Cr alloys revealed by accurate ab-initio thermodynamic and electrochemical calculations. &lt;em&gt;npj Materials Degradation&lt;/em&gt; &lt;strong&gt;2023&lt;/strong&gt;, &lt;em&gt;7&lt;/em&gt;, 100.&lt;/p&gt;
          &lt;p class=&quot;story-citation-doi&quot;&gt;doi.org/10.1038/s41529-023-00414-w&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;

    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;story-controls&quot;&gt;

&lt;/div&gt;

&lt;style&gt;
  #story { color: var(--foreground); max-width: 52rem; margin: 0 auto; }
  #story .story-progress { display: flex; gap: 4px; margin-bottom: 12px; }
  #story .story-progress-seg { flex: 1; height: 4px; border-radius: 2px; background: var(--muted); overflow: hidden; }
  #story .story-progress-seg::after { content: &quot;&quot;; display: block; height: 100%; width: 0%; background: var(--viz-series-1); transition: width 240ms ease; }
  #story .story-progress-seg.is-done::after, #story .story-progress-seg.is-current::after { width: 100%; }

  #story .story-viewport { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-2xl); background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12); }
  #story .story-track { display: flex; transition: transform 420ms cubic-bezier(.4,0,.2,1); }
  #story .story-slide { flex: 0 0 100%; box-sizing: border-box; padding: 24px clamp(18px, 4vw, 40px); min-height: 360px; display: flex; flex-direction: column; justify-content: center; gap: 9px; }

  #story .story-kicker { margin: 0; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; font-weight: 600; color: var(--viz-series-1); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #story .story-badge { text-transform: none; letter-spacing: normal; font-weight: 600; font-size: 11.5px; color: var(--viz-series-2, var(--destructive)); background: color-mix(in srgb, var(--viz-series-2, var(--destructive)) 16%, transparent); border-radius: var(--radius-full); padding: 2px 9px; }
  #story .story-slide h2 { font-size: clamp(19px, 2.3vw, 25px); line-height: 1.25; margin: 0 0 4px; max-width: 40rem; }
  #story .story-lede { font-size: 15.5px; }
  #story .story-slide p { font-size: 14.5px; line-height: 1.55; color: var(--foreground); max-width: 42rem; }
  #story .story-source, #story .story-caption, #story .story-note { color: var(--muted-foreground); font-size: 12.5px; }
  #story .story-see-also { font-style: italic; color: var(--muted-foreground); }

  #story .story-list { margin: 4px 0; padding-left: 1.2em; font-size: 14.5px; line-height: 1.55; max-width: 42rem; }
  #story .story-list li { margin-bottom: 4px; }

  #story .story-callout { border-radius: var(--radius-lg); padding: 12px 16px; margin-top: 4px; max-width: 42rem; border: 1px solid transparent; }
  #story .story-callout-label { margin: 0 0 4px; font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  #story .story-callout-text { margin: 0; font-size: 13.5px; line-height: 1.5; color: inherit; }
  #story .story-callout-theory { background: linear-gradient(135deg, color-mix(in srgb, var(--viz-series-1) 14%, var(--card)), color-mix(in srgb, var(--viz-series-1) 4%, var(--card))); border-color: color-mix(in srgb, var(--viz-series-1) 25%, transparent); }
  #story .story-callout-theory .story-callout-label { color: var(--viz-series-1); }
  #story .story-callout-data { background: linear-gradient(135deg, color-mix(in srgb, var(--viz-series-3, var(--viz-series-1)) 16%, var(--card)), color-mix(in srgb, var(--viz-series-3, var(--viz-series-1)) 4%, var(--card))); border-color: color-mix(in srgb, var(--viz-series-3, var(--viz-series-1)) 28%, transparent); }
  #story .story-callout-data .story-callout-label { color: var(--viz-series-3, var(--viz-series-1)); }
  #story .story-callout-detail { background: color-mix(in srgb, var(--foreground) 5%, var(--card)); border-color: var(--border); }
  #story .story-equation { font-size: 18px; margin: 2px 0 6px; font-weight: 700; }
  #story .story-equation-sm { font-size: 16px; }

  #story .story-stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0; }
  #story .story-stat { display: flex; flex-direction: column; gap: 2px; }
  #story .story-stat-card { padding: 10px 16px; border-radius: var(--radius-lg); background: linear-gradient(135deg, color-mix(in srgb, var(--viz-series-1) 12%, var(--card)), color-mix(in srgb, var(--viz-series-1) 3%, var(--card))); border: 1px solid color-mix(in srgb, var(--viz-series-1) 22%, transparent); max-width: 15rem; }
  #story .story-stat-value { font-size: 26px; font-weight: 700; line-height: 1.1; }
  #story .story-stat-value small { font-size: 14px; font-weight: 500; color: var(--muted-foreground); }
  #story .story-stat-unit { font-size: 12.5px; color: var(--muted-foreground); }
  #story .story-stat-alt { display: block; }
  #story .story-stat-label { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }

  #story .story-chart-wrap { width: 100%; margin-top: 2px; }
  #story .story-chart-wrap svg { width: 100%; height: 200px; display: block; }
  #story .story-chart-title { text-align: center; font-size: 12.5px; color: var(--muted-foreground); margin: 4px 0 0; }

  #story .story-bar { fill: var(--muted-foreground); }
  #story .story-bar.is-winner { fill: var(--viz-series-1); }
  #story .story-bar-label { fill: var(--foreground); font-size: 13px; }
  #story .story-bar-value { fill: var(--foreground); font-size: 13px; font-weight: 600; }

  #story .story-axis path, #story .story-axis line { stroke: var(--border); }
  #story .story-axis text { fill: var(--muted-foreground); font-size: 12px; }
  #story .story-axis-title { fill: var(--muted-foreground); font-size: 12.5px; }
  #story .story-line { fill: none; stroke-width: 2.5; }
  #story .story-line-predicted { stroke: var(--viz-series-1); }
  #story .story-line-illustrative { stroke: var(--viz-series-2, var(--destructive)); }
  #story .story-line-hot { stroke: var(--red, var(--destructive)); }
  #story .story-ref-line { stroke: var(--muted-foreground); stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
  #story .story-ref-label { fill: var(--muted-foreground); font-size: 11.5px; }
  #story .story-marker { fill: var(--viz-series-1); stroke: var(--card); stroke-width: 1.5; }
  #story .story-legend-text { fill: var(--foreground); font-size: 12px; }

  #story .story-citation { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 10px; max-width: 42rem; }
  #story .story-citation p { margin: 0 0 4px; font-size: 12.5px; color: var(--muted-foreground); }
  #story .story-citation-doi { font-family: var(--font-mono); font-size: 11px; }

  #story .story-controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px; }
  #story .story-nav { min-width: 40px; min-height: 40px; font-size: 20px; border-radius: var(--radius-full); }
  #story .story-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 20rem; }
  #story .story-dots button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: 0; background: var(--muted); cursor: pointer; }
  #story .story-dots button.is-current { background: var(--viz-series-1); }
  #story .story-hint { text-align: center; font-size: 12px; color: var(--muted-foreground); margin: 6px 0 0; }

  @media (prefers-reduced-motion: reduce) {
    #story .story-track { transition: none; }
    #story .story-progress-seg::after { transition: none; }
  }
  @media (max-width: 560px) {
    #story .story-slide { min-height: 420px; padding: 20px 16px; }
    #story .story-dots { max-width: 14rem; }
  }
&lt;/style&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;story&#x27;);
  const track = root.querySelector(&#x27;#story-track&#x27;);
  const slides = Array.from(root.querySelectorAll(&#x27;.story-slide&#x27;));
  const progressBar = root.querySelector(&#x27;#story-progress&#x27;);
  const dotsContainer = root.querySelector(&#x27;#story-dots&#x27;);
  const prevBtn = root.querySelector(&#x27;#story-prev&#x27;);
  const nextBtn = root.querySelector(&#x27;#story-next&#x27;);
  const positionLabel = root.querySelector(&#x27;#story-position&#x27;);
  const total = slides.length;
  let current = 0;
  const drawn = new Set();

  slides.forEach((slide, i) =&gt; {
    const seg = document.createElement(&#x27;div&#x27;);
    seg.className = &#x27;story-progress-seg&#x27;;
    seg.dataset.seg = String(i);
    progressBar.appendChild(seg);
    const dot = document.createElement(&#x27;button&#x27;);
    dot.type = &#x27;button&#x27;;
    dot.setAttribute(&#x27;role&#x27;, &#x27;tab&#x27;);
    dot.setAttribute(&#x27;aria-label&#x27;, `Go to slide ${i + 1} of ${total}`);
    dot.addEventListener(&#x27;click&#x27;, () =&gt; goTo(i));
    dotsContainer.appendChild(dot);
  });
  const segs = Array.from(progressBar.children);
  const dots = Array.from(dotsContainer.children);

  function update() {
    track.style.transform = `translateX(-${current * 100}%)`;
    segs.forEach((seg, i) =&gt; {
      seg.classList.toggle(&#x27;is-done&#x27;, i &lt; current);
      seg.classList.toggle(&#x27;is-current&#x27;, i === current);
    });
    dots.forEach((dot, i) =&gt; dot.classList.toggle(&#x27;is-current&#x27;, i === current));
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;
    positionLabel.textContent = `(${current + 1} / ${total})`;
    const chartKey = slides[current].dataset.chart;
    if (chartKey &amp;&amp; !drawn.has(chartKey)) {
      drawn.add(chartKey);
      drawChart(chartKey);
    }
  }

  function goTo(index) {
    current = Math.max(0, Math.min(total - 1, index));
    update();
  }

  prevBtn.addEventListener(&#x27;click&#x27;, () =&gt; goTo(current - 1));
  nextBtn.addEventListener(&#x27;click&#x27;, () =&gt; goTo(current + 1));
  document.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
    if (event.target instanceof HTMLElement &amp;&amp; /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
    if (event.key === &#x27;ArrowRight&#x27;) { goTo(current + 1); event.preventDefault(); }
    if (event.key === &#x27;ArrowLeft&#x27;) { goTo(current - 1); event.preventDefault(); }
  });

  function lineChart(svgId, titleId, descId, title, desc, series, opts) {
    const svg = d3.select(root.querySelector(&#x27;#&#x27; + svgId));
    const bounds = svg.node().getBoundingClientRect();
    const width = Math.max(280, Math.floor(bounds.width));
    const height = Math.max(180, Math.floor(bounds.height) || 240);
    const margin = Object.assign({ top: 18, right: 24, bottom: 40, left: 46 }, opts.margin || {});
    svg.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;preserveAspectRatio&#x27;, &#x27;xMidYMid meet&#x27;);
    svg.selectAll(&#x27;*&#x27;).remove();
    svg.append(&#x27;title&#x27;).attr(&#x27;id&#x27;, titleId).text(title);
    svg.append(&#x27;desc&#x27;).attr(&#x27;id&#x27;, descId).text(desc);

    const x = d3.scaleLinear().domain(opts.xDomain).range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain(opts.yDomain).range([height - margin.bottom, margin.top]);

    svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;story-axis&#x27;).attr(&#x27;transform&#x27;, `translate(0,${height - margin.bottom})`)
      .call(d3.axisBottom(x).ticks(opts.xTicks || 6).tickFormat(opts.xFormat || (d =&gt; d)));
    svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;story-axis&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(opts.yTicks || 5).tickFormat(opts.yFormat || (d =&gt; d)));
    if (opts.xLabel) svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-axis-title&#x27;).attr(&#x27;x&#x27;, (margin.left + width - margin.right) / 2).attr(&#x27;y&#x27;, height - 6).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(opts.xLabel);
    if (opts.yLabel) svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-axis-title&#x27;).attr(&#x27;transform&#x27;, `translate(14 ${(margin.top + height - margin.bottom) / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(opts.yLabel);

    (opts.hRefs || []).forEach(ref =&gt; {
      svg.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-line&#x27;).attr(&#x27;x1&#x27;, margin.left).attr(&#x27;x2&#x27;, width - margin.right).attr(&#x27;y1&#x27;, y(ref.y)).attr(&#x27;y2&#x27;, y(ref.y));
      svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-label&#x27;).attr(&#x27;x&#x27;, width - margin.right).attr(&#x27;y&#x27;, y(ref.y) - 5).attr(&#x27;text-anchor&#x27;, &#x27;end&#x27;).text(ref.label);
    });
    (opts.vRefs || []).forEach((ref, vi) =&gt; {
      svg.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-line&#x27;).attr(&#x27;y1&#x27;, margin.top).attr(&#x27;y2&#x27;, height - margin.bottom).attr(&#x27;x1&#x27;, x(ref.x)).attr(&#x27;x2&#x27;, x(ref.x));
      const roomToRight = (width - margin.right) - x(ref.x);
      const flip = roomToRight &lt; 130;
      svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-label&#x27;)
        .attr(&#x27;x&#x27;, x(ref.x) + (flip ? -4 : 4)).attr(&#x27;y&#x27;, margin.top + 11 + vi * 13)
        .attr(&#x27;text-anchor&#x27;, flip ? &#x27;end&#x27; : &#x27;start&#x27;).text(ref.label);
    });

    const line = d3.line().x(d =&gt; x(d.x)).y(d =&gt; y(d.y));
    const compact = width &lt; 500;
    series.forEach((s, i) =&gt; {
      const path = svg.append(&#x27;path&#x27;).datum(s.points).attr(&#x27;class&#x27;, &#x27;story-line &#x27; + (s.className || &#x27;story-line-predicted&#x27;)).attr(&#x27;d&#x27;, line);
      const len = path.node().getTotalLength();
      path.attr(&#x27;stroke-dasharray&#x27;, `${len} ${len}`).attr(&#x27;stroke-dashoffset&#x27;, len)
        .transition().delay(i * 150).duration(700).ease(d3.easeCubicOut).attr(&#x27;stroke-dashoffset&#x27;, 0)
        .on(&#x27;end interrupt&#x27;, function () { d3.select(this).attr(&#x27;stroke-dashoffset&#x27;, 0); });
      if (s.label) {
        const last = s.points[s.points.length - 1];
        svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-label&#x27;).attr(&#x27;x&#x27;, x(last.x) - 4).attr(&#x27;y&#x27;, y(last.y) + (s.labelDy || -8))
          .attr(&#x27;text-anchor&#x27;, &#x27;end&#x27;).style(&#x27;font-weight&#x27;, 600).text(compact &amp;&amp; s.labelShort ? s.labelShort : s.label);
      }
    });
  }

  function drawChart(key) {
    if (key === &#x27;e-ph&#x27;) {
      const pHs = d3.range(0, 7.01, 0.25);
      const waterUpper = pHs.map(p =&gt; ({ x: p, y: 1.23 - 0.0592 * p }));
      const waterLower = pHs.map(p =&gt; ({ x: p, y: -0.0592 * p }));
      const feLine = [{ x: 0, y: -0.44 }, { x: 7, y: -0.44 }];
      lineChart(&#x27;chart-e-ph&#x27;, &#x27;e-ph-title&#x27;, &#x27;e-ph-desc&#x27;,
        &#x27;Potential vs pH diagram for water stability and the iron couple&#x27;,
        &#x27;A line chart with potential in volts on the y axis and pH from 0 to 7 on the x axis. Two declining lines mark the boundaries of water\&#x27;s thermodynamic stability region, the oxygen-water line starting near 1.23 volts and the hydrogen-water line starting near 0 volts, both sloping downward. A third, flat horizontal line at minus 0.44 volts represents the iron 2 plus to iron couple, sitting below both water stability boundaries across this entire pH range.&#x27;,
        [
          { points: waterUpper, className: &#x27;story-line-illustrative&#x27;, label: &#x27;O₂ / H₂O&#x27;, labelDy: -8 },
          { points: waterLower, className: &#x27;story-line-illustrative&#x27;, label: &#x27;H⁺ / H₂&#x27;, labelDy: -8 },
          { points: feLine, className: &#x27;story-line-predicted&#x27;, label: &#x27;Fe²⁺ / Fe&#x27;, labelDy: 16 }
        ],
        { xDomain: [0, 7], yDomain: [-0.6, 1.3], xLabel: &#x27;pH&#x27;, yLabel: &#x27;E (V)&#x27;, xTicks: 7, yTicks: 5 });
    }
  }

  update();
  new ResizeObserver(() =&gt; { drawn.forEach(key =&gt; drawChart(key)); }).observe(root.querySelector(&#x27;.story-viewport&#x27;));
})();
&lt;/script&gt;
