    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;story&quot; class=&quot;story&quot; aria-roledescription=&quot;slide deck&quot; aria-label=&quot;Gibbs energy in practice: predicting the coral reef tipping point&quot;&gt;
  &lt;div class=&quot;story-progress&quot; role=&quot;presentation&quot; id=&quot;story-progress&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;story-viewport&quot;&gt;
    &lt;div class=&quot;story-track&quot; id=&quot;story-track&quot;&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;0&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;A real climate tipping point&lt;/p&gt;
        &lt;h2&gt;Why will some coral reefs start dissolving before they even bleach?&lt;/h2&gt;
        &lt;p class=&quot;story-lede&quot;&gt;Ocean acidification is usually framed as a threat to how &lt;em&gt;fast&lt;/em&gt; corals can build new skeleton. A 2018 study in &lt;em&gt;Science&lt;/em&gt; showed something sharper: the sand and rubble that already make up a reef can start dissolving away, releasing stored carbonate back into the water &amp;mdash; and scientists can predict exactly when, using nothing more than &lt;strong&gt;&amp;Delta;G = &amp;Delta;H &amp;minus; T&amp;Delta;S&lt;/strong&gt;.&lt;/p&gt;
        &lt;p class=&quot;story-source&quot;&gt;Sources: peer-reviewed &amp;mdash; &lt;em&gt;Science&lt;/em&gt; (2018); &lt;em&gt;Geochimica et Cosmochimica Acta&lt;/em&gt; (1982)&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;1&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;The Gibbs energy equation&lt;/p&gt;
        &lt;h2&gt;&amp;Delta;G = &amp;Delta;H &amp;minus; T&amp;Delta;S&lt;/h2&gt;
        &lt;p&gt;The process in question is deceptively simple: does a crystal of calcium carbonate &amp;mdash; the mineral coral skeletons and reef sand are made of &amp;mdash; dissolve, or does it grow?&lt;/p&gt;
        &lt;div class=&quot;story-callout story-callout-theory&quot;&gt;
          &lt;p class=&quot;story-callout-label&quot;&gt;The reaction&lt;/p&gt;
          &lt;p class=&quot;story-equation&quot;&gt;CaCO&lt;sub&gt;3&lt;/sub&gt;(s) &amp;#8652; Ca&lt;sup&gt;2+&lt;/sup&gt;(aq) + CO&lt;sub&gt;3&lt;/sub&gt;&lt;sup&gt;2&amp;minus;&lt;/sup&gt;(aq)&lt;/p&gt;
          &lt;p class=&quot;story-callout-text&quot;&gt;&amp;Delta;G tells you which way this arrow runs. &amp;Delta;G &amp;lt; 0: dissolution happens on its own. &amp;Delta;G &amp;gt; 0: the reverse, precipitation, is what happens on its own.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;2&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Why this equation? &amp;middot; 1 of 2&lt;/p&gt;
        &lt;h2&gt;Enthalpy alone can&#x27;t tell you which way a reaction goes&lt;/h2&gt;
        &lt;p&gt;It&#x27;s tempting to assume &quot;releases heat&quot; means &quot;happens easily.&quot; That&#x27;s only half the story. The other half is entropy &amp;mdash; how disordered the system becomes &amp;mdash; and for an ionic solid dissolving in water, the entropy term is often what actually decides the outcome.&lt;/p&gt;
        &lt;p class=&quot;story-see-also&quot;&gt;See also, in this collection: the interactive Gibbs energy explorer.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;3&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Why this equation? &amp;middot; 2 of 2&lt;/p&gt;
        &lt;h2&gt;It turns a decades-old solubility measurement into a climate prediction&lt;/h2&gt;
        &lt;p&gt;Geochemists have carefully measured how the solubility constant (&lt;em&gt;K&lt;/em&gt;&lt;sub&gt;sp&lt;/sub&gt;) of calcium carbonate changes with temperature since the early 1980s. Because &lt;em&gt;K&lt;/em&gt;&lt;sub&gt;sp&lt;/sub&gt; is just a disguised form of &amp;Delta;G&amp;deg;, that one temperature-dependence curve secretly contains &amp;Delta;H&amp;deg; and &amp;Delta;S&amp;deg; too &amp;mdash; no new experiment required, just calculus applied to an equation the original authors already published.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;4&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;The measurement&lt;/p&gt;
        &lt;h2&gt;How soluble is coral mineral, and how does that change with temperature?&lt;/h2&gt;
        &lt;ul class=&quot;story-list&quot;&gt;
          &lt;li&gt;Plummer &amp;amp; Busenberg (1982), &lt;em&gt;Geochimica et Cosmochimica Acta&lt;/em&gt; &amp;mdash; one of the most cited papers in marine chemistry (1,800+ citations)&lt;/li&gt;
          &lt;li&gt;Measured the solubility constant of &lt;strong&gt;aragonite&lt;/strong&gt; &amp;mdash; the exact mineral corals build their skeletons from &amp;mdash; across 0&amp;ndash;90&amp;nbsp;&amp;deg;C&lt;/li&gt;
          &lt;li&gt;At 25&amp;nbsp;&amp;deg;C: log&lt;sub&gt;10&lt;/sub&gt;&lt;em&gt;K&lt;/em&gt;&lt;sub&gt;sp&lt;/sub&gt; = &amp;minus;8.336 &amp;plusmn; 0.020 &amp;mdash; only a few micromoles of CaCO&lt;sub&gt;3&lt;/sub&gt; dissolve per litre of pure water&lt;/li&gt;
          &lt;li&gt;Reported as one smooth equation fit to hundreds of individual solubility measurements&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;5&quot; data-chart=&quot;ksp-curve&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Results &amp;middot; step 1&lt;/p&gt;
        &lt;h2&gt;The published solubility curve, over the full measured range&lt;/h2&gt;
        &lt;p&gt;This is the paper&#x27;s own equation, evaluated continuously from 0 to 90&amp;nbsp;&amp;deg;C &amp;mdash; not a sketch. Aragonite becomes &lt;em&gt;less&lt;/em&gt; soluble as the ocean warms, a clue that &amp;Delta;H&amp;deg; for dissolving it is small.&lt;/p&gt;
        &lt;div class=&quot;story-chart-wrap&quot;&gt;&lt;svg id=&quot;chart-ksp-curve&quot; role=&quot;img&quot; aria-labelledby=&quot;ksp-curve-title ksp-curve-desc&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
        &lt;p class=&quot;story-caption&quot;&gt;log&lt;sub&gt;10&lt;/sub&gt;&lt;em&gt;K&lt;/em&gt;&lt;sub&gt;sp&lt;/sub&gt; for aragonite vs. temperature, from Plummer &amp;amp; Busenberg&#x27;s fitted equation. Marker at 25&amp;nbsp;&amp;deg;C.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;6&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Results &amp;middot; step 2&lt;/p&gt;
        &lt;h2&gt;One curve, three thermodynamic numbers&lt;/h2&gt;
        &lt;p&gt;&amp;Delta;G&amp;deg; = &amp;minus;&lt;em&gt;RT&lt;/em&gt;ln&lt;em&gt;K&lt;/em&gt;&lt;sub&gt;sp&lt;/sub&gt;, and &amp;Delta;H&amp;deg; = &lt;em&gt;RT&lt;/em&gt;&amp;sup2;&amp;middot;d(ln&lt;em&gt;K&lt;/em&gt;&lt;sub&gt;sp&lt;/sub&gt;)/d&lt;em&gt;T&lt;/em&gt; &amp;mdash; both direct, standard consequences of the curve on the previous slide. &amp;Delta;S&amp;deg; then follows from the Gibbs equation itself.&lt;/p&gt;
        &lt;div class=&quot;story-stat-row&quot;&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;+47.6&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;kJ&amp;nbsp;mol&amp;#8315;&amp;sup1;&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;&amp;Delta;G&amp;deg; at 25 &amp;deg;C (standard, 1&amp;nbsp;M ions)&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;&amp;minus;10.8&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;kJ&amp;nbsp;mol&amp;#8315;&amp;sup1;&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;&amp;Delta;H&amp;deg; &amp;mdash; mildly exothermic&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;&amp;minus;196&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;J&amp;nbsp;mol&amp;#8315;&amp;sup1;K&amp;#8315;&amp;sup1;&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;&amp;Delta;S&amp;deg; &amp;mdash; strongly unfavorable&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;story-note&quot;&gt;Computed directly from Plummer &amp;amp; Busenberg&#x27;s published log&amp;nbsp;&lt;em&gt;K&lt;/em&gt;&lt;sub&gt;sp&lt;/sub&gt;(&lt;em&gt;T&lt;/em&gt;) equation for aragonite &amp;mdash; not independently measured, but an exact thermodynamic consequence of their fit.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;7&quot; data-chart=&quot;enthalpy-entropy&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Results &amp;middot; step 3&lt;/p&gt;
        &lt;h2&gt;Entropy, not enthalpy, is what&#x27;s actually stopping this reaction&lt;/h2&gt;
        &lt;p&gt;Breaking apart the ionic lattice costs almost nothing in energy terms. The real cost is entropic: freeing Ca&lt;sup&gt;2+&lt;/sup&gt; and CO&lt;sub&gt;3&lt;/sub&gt;&lt;sup&gt;2&amp;minus;&lt;/sup&gt; forces nearby water molecules into a rigid, ordered cage around each highly-charged ion.&lt;/p&gt;
        &lt;div class=&quot;story-chart-wrap&quot;&gt;&lt;svg id=&quot;chart-enthalpy-entropy&quot; role=&quot;img&quot; aria-labelledby=&quot;enthalpy-entropy-title enthalpy-entropy-desc&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
        &lt;p class=&quot;story-caption&quot;&gt;Magnitude of each term in &amp;Delta;G&amp;deg; = &amp;Delta;H&amp;deg; &amp;minus; T&amp;Delta;S&amp;deg; at 25&amp;nbsp;&amp;deg;C. The entropy penalty outweighs the enthalpy release more than fivefold.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;8&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;From the lab to the ocean&lt;/p&gt;
        &lt;h2&gt;In real seawater, it isn&#x27;t &amp;Delta;G&amp;deg; that matters &amp;mdash; it&#x27;s &amp;Omega;&lt;/h2&gt;
        &lt;p&gt;&amp;Delta;G&amp;deg; above assumes a hypothetical 1&amp;nbsp;mol/L solution of each ion &amp;mdash; nothing like the ocean. For real seawater, the same thermodynamics collapses to one ratio: the saturation state, &amp;Omega; = [Ca&lt;sup&gt;2+&lt;/sup&gt;][CO&lt;sub&gt;3&lt;/sub&gt;&lt;sup&gt;2&amp;minus;&lt;/sup&gt;] / &lt;em&gt;K&lt;/em&gt;&lt;sub&gt;sp&lt;/sub&gt;.&lt;/p&gt;
        &lt;div class=&quot;story-callout story-callout-theory&quot;&gt;
          &lt;p class=&quot;story-equation story-equation-sm&quot;&gt;&amp;Delta;G = &lt;em&gt;RT&lt;/em&gt; ln &amp;Omega;&lt;/p&gt;
          &lt;p class=&quot;story-callout-text&quot;&gt;&amp;Omega; &amp;gt; 1: supersaturated, CaCO&lt;sub&gt;3&lt;/sub&gt; tends to form. &amp;Omega; &amp;lt; 1: undersaturated, CaCO&lt;sub&gt;3&lt;/sub&gt; tends to dissolve. &amp;Omega; = 1 is the knife-edge, &amp;Delta;G = 0. Dissolving CO&lt;sub&gt;2&lt;/sub&gt; into seawater lowers [CO&lt;sub&gt;3&lt;/sub&gt;&lt;sup&gt;2&amp;minus;&lt;/sup&gt;] &amp;mdash; and with it, &amp;Omega;.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;9&quot; data-chart=&quot;gibbs-omega&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Results &amp;middot; step 4&lt;/p&gt;
        &lt;h2&gt;Where the real reef actually crosses zero&lt;/h2&gt;
        &lt;p&gt;The curve below is the exact relationship &amp;Delta;G = &lt;em&gt;RT&lt;/em&gt;ln&amp;Omega; &amp;mdash; not a sketch. A 2018 global study measured where a real reef&#x27;s sediment actually tips into net dissolution.&lt;/p&gt;
        &lt;div class=&quot;story-chart-wrap&quot;&gt;&lt;svg id=&quot;chart-gibbs-omega&quot; role=&quot;img&quot; aria-labelledby=&quot;gibbs-omega-title gibbs-omega-desc&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
        &lt;p class=&quot;story-caption&quot;&gt;The measured tipping point sits well before the idealized &amp;Omega; = 1 line &amp;mdash; see why on slide 11.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;10&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;The real-world finding&lt;/p&gt;
        &lt;h2&gt;A 2018 global study measured exactly where that line falls&lt;/h2&gt;
        &lt;div class=&quot;story-stat-row&quot;&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;2.92 &lt;small&gt;&amp;plusmn; 0.16&lt;/small&gt;&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;measured across 5 globally distributed reef sites&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;Critical &amp;Omega;&lt;sub&gt;arag&lt;/sub&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;10&amp;times;&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;more sensitive to acidification than coral calcification itself&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;Sediment dissolution sensitivity&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;story-stat story-stat-card&quot;&gt;
            &lt;span class=&quot;story-stat-value&quot;&gt;&amp;asymp;2050&lt;/span&gt;
            &lt;span class=&quot;story-stat-unit&quot;&gt;on current emissions trends&lt;/span&gt;
            &lt;span class=&quot;story-stat-label&quot;&gt;Expected global crossing&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;story-note&quot;&gt;Some reef sites are already experiencing net sediment dissolution today. Source: Eyre, Cyronak, Drupp, De Carlo, Sachs &amp;amp; Andersson, &lt;em&gt;Science&lt;/em&gt; 359(6378), 2018.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;11&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Why doesn&#x27;t it happen exactly at &amp;Omega; = 1?&lt;/p&gt;
        &lt;h2&gt;The water that touches the sand isn&#x27;t the water sampled from a boat&lt;/h2&gt;
        &lt;p&gt;Reef sediment isn&#x27;t inert sand &amp;mdash; it&#x27;s packed with bacteria respiring organic matter, which locally produces CO&lt;sub&gt;2&lt;/sub&gt; and pushes the &lt;em&gt;pore water&lt;/em&gt;&#x27;s own saturation state below the open-ocean value measured overhead. The grains &quot;feel&quot; a more corrosive &amp;Omega; than the headline number reports.&lt;/p&gt;
        &lt;div class=&quot;story-callout story-callout-data&quot;&gt;
          &lt;p class=&quot;story-callout-label&quot;&gt;Supporting mechanism&lt;/p&gt;
          &lt;p class=&quot;story-callout-text&quot;&gt;Andersson (2015, &lt;em&gt;Frontiers in Marine Science&lt;/em&gt;) traces reef sediment dissolution to exactly this: the extent of organic matter decomposition needed to push local pore water past its own &quot;Carbonate Critical Threshold.&quot;&lt;/p&gt;
        &lt;/div&gt;
        &lt;p class=&quot;story-note&quot;&gt;A deviation with a diagnosed, quantified cause &amp;mdash; not a model that simply failed.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;12&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;Why this matters&lt;/p&gt;
        &lt;h2&gt;Hundreds of millions of people depend on the sign of &amp;Delta;G staying negative&lt;/h2&gt;
        &lt;p&gt;Coral reefs feed millions of people worldwide, provide coastal protection, and generate billions of dollars annually in tourism revenue (Albright et al., &lt;em&gt;Nature&lt;/em&gt;, 2018). Roughly 500 million people derive food, income and coastal protection from reef ecosystems (Hoegh-Guldberg et al., &lt;em&gt;Frontiers in Marine Science&lt;/em&gt;, 2017).&lt;/p&gt;
        &lt;p&gt;Thermodynamics turns a vague worry &amp;mdash; &quot;acidification is bad for reefs&quot; &amp;mdash; into a falling number with a measured, citable threshold.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;story-slide&quot; data-slide=&quot;13&quot;&gt;
        &lt;p class=&quot;story-kicker&quot;&gt;The takeaway&lt;/p&gt;
        &lt;h2&gt;One equation, a 1982 solubility curve, a 2018 global measurement&lt;/h2&gt;
        &lt;p&gt;This is what the Gibbs energy equation is for outside the classroom: one thermodynamic relationship, applied to a decades-old solubility fit, predicting exactly when &amp;mdash; and mechanistically why &amp;mdash; one of the planet&#x27;s most important ecosystems starts to dissolve.&lt;/p&gt;
        &lt;p class=&quot;story-see-also&quot;&gt;See also, in this collection: the interactive Gibbs energy explorer.&lt;/p&gt;
        &lt;div class=&quot;story-citation&quot;&gt;
          &lt;p&gt;Plummer, L.N.; Busenberg, E. The solubilities of calcite, aragonite and vaterite in CO&lt;sub&gt;2&lt;/sub&gt;-H&lt;sub&gt;2&lt;/sub&gt;O solutions between 0 and 90&amp;deg;C. &lt;em&gt;Geochimica et Cosmochimica Acta&lt;/em&gt; &lt;strong&gt;1982&lt;/strong&gt;, &lt;em&gt;46&lt;/em&gt;(5), 1011&amp;ndash;1040.&lt;/p&gt;
          &lt;p&gt;Eyre, B.D.; Cyronak, T.; Drupp, P.; De Carlo, E.H.; Sachs, J.P.; Andersson, A.J. Coral reefs will transition to net dissolving before end of century. &lt;em&gt;Science&lt;/em&gt; &lt;strong&gt;2018&lt;/strong&gt;, &lt;em&gt;359&lt;/em&gt;(6378), 908&amp;ndash;911.&lt;/p&gt;
          &lt;p&gt;Andersson, A.J. A fundamental paradigm for coral reef carbonate sediment dissolution. &lt;em&gt;Frontiers in Marine Science&lt;/em&gt; &lt;strong&gt;2015&lt;/strong&gt;, &lt;em&gt;2&lt;/em&gt;, 52.&lt;/p&gt;
          &lt;p class=&quot;story-citation-doi&quot;&gt;doi.org/10.1016/0016-7037(82)90056-4 &amp;middot; doi.org/10.1126/science.aao1118 &amp;middot; doi.org/10.3389/fmars.2015.00052&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;

    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;story-controls&quot;&gt;

    &lt;div class=&quot;story-dots&quot; id=&quot;story-dots&quot; role=&quot;tablist&quot; aria-label=&quot;Slide navigation&quot;&gt;&lt;/div&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;story&#x27;);
  const track = root.querySelector(&#x27;#story-track&#x27;);
  const slides = Array.from(root.querySelectorAll(&#x27;.story-slide&#x27;));
  const progressBar = root.querySelector(&#x27;#story-progress&#x27;);
  const dotsContainer = root.querySelector(&#x27;#story-dots&#x27;);
  const prevBtn = root.querySelector(&#x27;#story-prev&#x27;);
  const nextBtn = root.querySelector(&#x27;#story-next&#x27;);
  const positionLabel = root.querySelector(&#x27;#story-position&#x27;);
  const total = slides.length;
  let current = 0;
  const drawn = new Set();

  slides.forEach((slide, i) =&gt; {
    const seg = document.createElement(&#x27;div&#x27;);
    seg.className = &#x27;story-progress-seg&#x27;;
    seg.dataset.seg = String(i);
    progressBar.appendChild(seg);
    const dot = document.createElement(&#x27;button&#x27;);
    dot.type = &#x27;button&#x27;;
    dot.setAttribute(&#x27;role&#x27;, &#x27;tab&#x27;);
    dot.setAttribute(&#x27;aria-label&#x27;, `Go to slide ${i + 1} of ${total}`);
    dot.addEventListener(&#x27;click&#x27;, () =&gt; goTo(i));
    dotsContainer.appendChild(dot);
  });
  const segs = Array.from(progressBar.children);
  const dots = Array.from(dotsContainer.children);

  function update() {
    track.style.transform = `translateX(-${current * 100}%)`;
    segs.forEach((seg, i) =&gt; {
      seg.classList.toggle(&#x27;is-done&#x27;, i &lt; current);
      seg.classList.toggle(&#x27;is-current&#x27;, i === current);
    });
    dots.forEach((dot, i) =&gt; dot.classList.toggle(&#x27;is-current&#x27;, i === current));
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === total - 1;
    positionLabel.textContent = `(${current + 1} / ${total})`;
    const chartKey = slides[current].dataset.chart;
    if (chartKey &amp;&amp; !drawn.has(chartKey)) {
      drawn.add(chartKey);
      drawChart(chartKey);
    }
  }

  function goTo(index) {
    current = Math.max(0, Math.min(total - 1, index));
    update();
  }

  prevBtn.addEventListener(&#x27;click&#x27;, () =&gt; goTo(current - 1));
  nextBtn.addEventListener(&#x27;click&#x27;, () =&gt; goTo(current + 1));
  document.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
    if (event.target instanceof HTMLElement &amp;&amp; /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
    if (event.key === &#x27;ArrowRight&#x27;) { goTo(current + 1); event.preventDefault(); }
    if (event.key === &#x27;ArrowLeft&#x27;) { goTo(current - 1); event.preventDefault(); }
  });

  function barChart(svgId, titleId, descId, title, desc, data, opts) {
    const svg = d3.select(root.querySelector(&#x27;#&#x27; + svgId));
    const bounds = svg.node().getBoundingClientRect();
    const width = Math.max(260, Math.floor(bounds.width));
    const height = Math.max(160, Math.floor(bounds.height) || 200);
    const margin = { top: 16, right: opts.suffixWidth || 56, bottom: 16, left: opts.labelWidth || 110 };
    svg.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;preserveAspectRatio&#x27;, &#x27;xMidYMid meet&#x27;);
    svg.selectAll(&#x27;*&#x27;).remove();
    svg.append(&#x27;title&#x27;).attr(&#x27;id&#x27;, titleId).text(title);
    svg.append(&#x27;desc&#x27;).attr(&#x27;id&#x27;, descId).text(desc);

    const y = d3.scaleBand().domain(data.map(d =&gt; d.label)).range([margin.top, height - margin.bottom]).padding(0.32);
    const x = d3.scaleLinear().domain([0, opts.max]).range([margin.left, width - margin.right]);

    const rows = svg.selectAll(&#x27;g.row&#x27;).data(data).join(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;row&#x27;);
    rows.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-bar-label&#x27;).attr(&#x27;x&#x27;, margin.left - 8).attr(&#x27;y&#x27;, d =&gt; y(d.label) + y.bandwidth() / 2).attr(&#x27;dy&#x27;, &#x27;0.35em&#x27;).attr(&#x27;text-anchor&#x27;, &#x27;end&#x27;).text(d =&gt; d.label);
    const bars = rows.append(&#x27;rect&#x27;)
      .attr(&#x27;class&#x27;, d =&gt; &#x27;story-bar&#x27; + (d.winner ? &#x27; is-winner&#x27; : &#x27;&#x27;))
      .attr(&#x27;x&#x27;, x(0)).attr(&#x27;y&#x27;, d =&gt; y(d.label)).attr(&#x27;height&#x27;, y.bandwidth()).attr(&#x27;rx&#x27;, 4)
      .attr(&#x27;width&#x27;, 0);
    bars.transition().duration(650).ease(d3.easeCubicOut).attr(&#x27;width&#x27;, d =&gt; x(d.value) - x(0));
    rows.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-bar-value&#x27;).attr(&#x27;x&#x27;, d =&gt; x(d.value) + 6).attr(&#x27;y&#x27;, d =&gt; y(d.label) + y.bandwidth() / 2).attr(&#x27;dy&#x27;, &#x27;0.35em&#x27;).attr(&#x27;text-anchor&#x27;, &#x27;start&#x27;)
      .text(d =&gt; opts.format(d.value)).attr(&#x27;opacity&#x27;, 0).transition().delay(400).duration(300).attr(&#x27;opacity&#x27;, 1);
  }

  function lineChart(svgId, titleId, descId, title, desc, series, opts) {
    const svg = d3.select(root.querySelector(&#x27;#&#x27; + svgId));
    const bounds = svg.node().getBoundingClientRect();
    const width = Math.max(280, Math.floor(bounds.width));
    const height = Math.max(180, Math.floor(bounds.height) || 240);
    const margin = Object.assign({ top: 18, right: 24, bottom: 40, left: 46 }, opts.margin || {});
    svg.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;preserveAspectRatio&#x27;, &#x27;xMidYMid meet&#x27;);
    svg.selectAll(&#x27;*&#x27;).remove();
    svg.append(&#x27;title&#x27;).attr(&#x27;id&#x27;, titleId).text(title);
    svg.append(&#x27;desc&#x27;).attr(&#x27;id&#x27;, descId).text(desc);

    const x = d3.scaleLinear().domain(opts.xDomain).range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain(opts.yDomain).range([height - margin.bottom, margin.top]);

    svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;story-axis&#x27;).attr(&#x27;transform&#x27;, `translate(0,${height - margin.bottom})`)
      .call(d3.axisBottom(x).ticks(opts.xTicks || 6).tickFormat(opts.xFormat || (d =&gt; d)));
    svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;story-axis&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(opts.yTicks || 5).tickFormat(opts.yFormat || (d =&gt; d)));
    if (opts.xLabel) svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-axis-title&#x27;).attr(&#x27;x&#x27;, (margin.left + width - margin.right) / 2).attr(&#x27;y&#x27;, height - 6).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(opts.xLabel);
    if (opts.yLabel) svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-axis-title&#x27;).attr(&#x27;transform&#x27;, `translate(14 ${(margin.top + height - margin.bottom) / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(opts.yLabel);

    (opts.hRefs || []).forEach(ref =&gt; {
      svg.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-line&#x27;).attr(&#x27;x1&#x27;, margin.left).attr(&#x27;x2&#x27;, width - margin.right).attr(&#x27;y1&#x27;, y(ref.y)).attr(&#x27;y2&#x27;, y(ref.y));
      svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-label&#x27;).attr(&#x27;x&#x27;, width - margin.right).attr(&#x27;y&#x27;, y(ref.y) - 5).attr(&#x27;text-anchor&#x27;, &#x27;end&#x27;).text(ref.label);
    });
    (opts.vRefs || []).forEach((ref, vi) =&gt; {
      svg.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-line&#x27;).attr(&#x27;y1&#x27;, margin.top).attr(&#x27;y2&#x27;, height - margin.bottom).attr(&#x27;x1&#x27;, x(ref.x)).attr(&#x27;x2&#x27;, x(ref.x));
      const roomToRight = (width - margin.right) - x(ref.x);
      const flip = roomToRight &lt; 130;
      svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;story-ref-label&#x27;)
        .attr(&#x27;x&#x27;, x(ref.x) + (flip ? -4 : 4)).attr(&#x27;y&#x27;, margin.top + 11 + vi * 13)
        .attr(&#x27;text-anchor&#x27;, flip ? &#x27;end&#x27; : &#x27;start&#x27;).text(ref.label);
    });

    const line = d3.line().x(d =&gt; x(d.x)).y(d =&gt; y(d.y));
    series.forEach((s, i) =&gt; {
      const path = svg.append(&#x27;path&#x27;).datum(s.points).attr(&#x27;class&#x27;, &#x27;story-line &#x27; + (s.className || &#x27;story-line-predicted&#x27;)).attr(&#x27;d&#x27;, line);
      const len = path.node().getTotalLength();
      path.attr(&#x27;stroke-dasharray&#x27;, `${len} ${len}`).attr(&#x27;stroke-dashoffset&#x27;, len)
        .transition().delay(i * 150).duration(700).ease(d3.easeCubicOut).attr(&#x27;stroke-dashoffset&#x27;, 0)
        .on(&#x27;end interrupt&#x27;, function () { d3.select(this).attr(&#x27;stroke-dashoffset&#x27;, 0); });
      if (s.showPoints) {
        svg.selectAll(&#x27;circle.pt-&#x27; + i).data(s.points).join(&#x27;circle&#x27;).attr(&#x27;class&#x27;, &#x27;story-marker pt-&#x27; + i)
          .attr(&#x27;cx&#x27;, d =&gt; x(d.x)).attr(&#x27;cy&#x27;, d =&gt; y(d.y)).attr(&#x27;r&#x27;, 0)
          .transition().delay(500 + i * 150).duration(300).attr(&#x27;r&#x27;, 4.5);
      }
    });
  }

  function logKspAragonite(T_K) {
    return -171.9773 - 0.077993 * T_K + 2903.293 / T_K + 71.595 * Math.log10(T_K);
  }

  function drawChart(key) {
    if (key === &#x27;ksp-curve&#x27;) {
      const temps = d3.range(0, 90.01, 2);
      const points = temps.map(tc =&gt; ({ x: tc, y: logKspAragonite(tc + 273.15) }));
      lineChart(&#x27;chart-ksp-curve&#x27;, &#x27;ksp-curve-title&#x27;, &#x27;ksp-curve-desc&#x27;,
        &#x27;Aragonite solubility constant vs temperature&#x27;,
        &#x27;A line chart of log base ten of the aragonite solubility constant against temperature from 0 to 90 degrees Celsius, computed from Plummer and Busenberg\&#x27;s 1982 published equation. The curve declines gently, showing aragonite becomes less soluble as temperature rises. A marker sits at 25 degrees Celsius.&#x27;,
        [{ points, className: &#x27;story-line-predicted&#x27;, showPoints: false }],
        { xDomain: [0, 90], yDomain: [-8.9, -8.0], xLabel: &#x27;Temperature (°C)&#x27;, yLabel: &#x27;log₁₀ Ksp&#x27;, xTicks: 6, yTicks: 5,
          vRefs: [{ x: 25, label: &#x27;25 °C&#x27; }] });
    }
    if (key === &#x27;enthalpy-entropy&#x27;) {
      barChart(&#x27;chart-enthalpy-entropy&#x27;, &#x27;enthalpy-entropy-title&#x27;, &#x27;enthalpy-entropy-desc&#x27;,
        &#x27;Magnitude of enthalpy versus entropy term at 25 degrees Celsius&#x27;,
        &#x27;A bar chart comparing the magnitude of the enthalpy term, 10.8 kilojoules per mole, against the magnitude of the temperature times entropy term, 58.4 kilojoules per mole, in the Gibbs energy equation for aragonite dissolution. The entropy term is more than five times larger.&#x27;,
        [
          { label: &#x27;|TΔS°|&#x27;, value: 58.4, winner: true },
          { label: &#x27;|ΔH°|&#x27;, value: 10.8 }
        ], { max: 65, format: d =&gt; d.toFixed(1) + &#x27; kJ/mol&#x27;, labelWidth: 56, suffixWidth: 70 });
    }
    if (key === &#x27;gibbs-omega&#x27;) {
      const R = 8.314, T = 298.15;
      const omegas = d3.range(0.3, 4.001, 0.1);
      const points = omegas.map(w =&gt; ({ x: w, y: (R * T * Math.log(w)) / 1000 }));
      lineChart(&#x27;chart-gibbs-omega&#x27;, &#x27;gibbs-omega-title&#x27;, &#x27;gibbs-omega-desc&#x27;,
        &#x27;Gibbs energy of dissolution versus saturation state omega&#x27;,
        &#x27;A line chart showing Delta G equals R T times the natural log of Omega, in kilojoules per mole, as a function of the saturation state Omega from 0.3 to 4. The curve crosses zero at Omega equals 1, the equilibrium point. A reference line marks Omega equals 2.92, the measured reef sediment tipping point reported by Eyre and colleagues in 2018, where Delta G is still slightly positive on this idealized curve.&#x27;,
        [{ points, className: &#x27;story-line-predicted&#x27;, showPoints: false }],
        { xDomain: [0.3, 4], yDomain: [-3.5, 4], xLabel: &#x27;Ω (saturation state)&#x27;, yLabel: &#x27;ΔG (kJ/mol)&#x27;, xTicks: 6, yTicks: 5,
          hRefs: [{ y: 0, label: &#x27;ΔG = 0&#x27; }],
          vRefs: [{ x: 1, label: &#x27;Ω = 1&#x27; }, { x: 2.92, label: &#x27;Reef tips: Ω ≈ 2.92&#x27; }] });
    }
  }

  update();
  new ResizeObserver(() =&gt; { drawn.forEach(key =&gt; drawChart(key)); }).observe(root.querySelector(&#x27;.story-viewport&#x27;));
})();
&lt;/script&gt;
