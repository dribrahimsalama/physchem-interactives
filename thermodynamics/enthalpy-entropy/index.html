    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;ee-explorer&quot;&gt;
  &lt;h2&gt;Enthalpy &amp;amp; entropy explorer&lt;/h2&gt;
  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Heating curve controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;ee-substance&quot;&gt;Substance
      &lt;select id=&quot;ee-substance&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;water&quot;&gt;Water&lt;/option&gt;
        &lt;option value=&quot;ethanol&quot;&gt;Ethanol&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;ee-mass&quot;&gt;Sample mass &lt;output id=&quot;ee-mass-value&quot; class=&quot;tabular-nums&quot;&gt;100 g&lt;/output&gt;
      &lt;input id=&quot;ee-mass&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;10&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;ee-q&quot;&gt;Heat added &lt;output id=&quot;ee-q-value&quot; class=&quot;tabular-nums&quot;&gt;0 kJ&lt;/output&gt;
      &lt;input id=&quot;ee-q&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;1&quot; value=&quot;0&quot;&gt;
    &lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ee-content&quot;&gt;
    &lt;div class=&quot;ee-chart-wrap&quot;&gt;&lt;svg id=&quot;ee-chart&quot; role=&quot;img&quot; aria-labelledby=&quot;ee-chart-title ee-chart-desc&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;aside class=&quot;ee-explanation&quot; aria-label=&quot;Plot interpretation&quot;&gt;
    &lt;h3&gt;How to interpret the plot&lt;/h3&gt;
    &lt;p&gt;The curve shows temperature as heat is added to the sample at constant pressure. Flat sections are phase changes &amp;mdash; all the energy goes into separating molecules, not raising temperature.&lt;/p&gt;
    &lt;h3 id=&quot;ee-guidance-title&quot;&gt;Current graph: theory&lt;/h3&gt;
    &lt;p id=&quot;ee-guidance&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;p id=&quot;ee-status&quot; class=&quot;ee-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;/aside&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #ee-explorer { color: var(--foreground); }
  #ee-explorer .viz-controls { align-items: end; gap: 14px; }
  #ee-explorer .form-label { min-width: 155px; flex: 1 1 155px; }
  #ee-explorer output { float: right; max-width: 100%; overflow-wrap: anywhere; color: var(--muted-foreground); }
  #ee-explorer .ee-content { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(230px, .8fr); gap: 18px; align-items: stretch; margin-top: 14px; }
  #ee-explorer .ee-chart-wrap { width: 100%; grid-column: 1; grid-row: 1; }
  #ee-explorer svg { width: 100%; height: 440px; display: block; }
  #ee-explorer .ee-axis { color: var(--foreground); }
  #ee-explorer .ee-axis path, #ee-explorer .ee-axis line { stroke: var(--border); }
  #ee-explorer .ee-axis text { fill: var(--foreground); font-size: 15px; }
  #ee-explorer .ee-axis-title, #ee-explorer .ee-direct-label { fill: var(--foreground); font-size: 16px; }
  #ee-explorer .ee-current { fill: none; stroke: var(--viz-series-1); stroke-width: 3; }
  #ee-explorer .ee-phase-band { fill: var(--viz-series-2, var(--destructive)); opacity: .12; }
  #ee-explorer .ee-guide { stroke: var(--destructive); stroke-width: 1.5; stroke-dasharray: 4 4; }
  #ee-explorer .ee-marker { fill: var(--viz-series-1); stroke: var(--card); stroke-width: 2; }
  #ee-explorer .ee-frame { fill: none; stroke: var(--border); }
  #ee-explorer .ee-explanation { grid-column: 2; grid-row: 1; align-self: center; padding: 12px 14px; border-left: 4px solid var(--viz-series-1); background: var(--muted); }
  #ee-explorer .ee-explanation h3 { margin: 0 0 6px; font-size: 18px; }
  #ee-explorer .ee-explanation h3:not(:first-child) { margin-top: 14px; }
  #ee-explorer .ee-explanation p { margin: 6px 0 0; font-size: 16px; line-height: 1.5; }
  #ee-explorer .ee-result { font-weight: 600; }
  @media (max-width: 680px) { #ee-explorer .ee-content { grid-template-columns: 1fr; } #ee-explorer .ee-chart-wrap, #ee-explorer .ee-explanation { grid-column: 1; grid-row: auto; } }
  @media (max-width: 420px) { #ee-explorer svg { height: 360px; } }
&lt;/style&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ee-explorer&#x27;);
  const chart = d3.select(root.querySelector(&#x27;#ee-chart&#x27;));
  const substanceSelect = root.querySelector(&#x27;#ee-substance&#x27;);
  const massInput = root.querySelector(&#x27;#ee-mass&#x27;);
  const qInput = root.querySelector(&#x27;#ee-q&#x27;);
  const status = root.querySelector(&#x27;#ee-status&#x27;);
  const guidanceTitle = root.querySelector(&#x27;#ee-guidance-title&#x27;);
  const guidance = root.querySelector(&#x27;#ee-guidance&#x27;);
  const outputs = {
    mass: root.querySelector(&#x27;#ee-mass-value&#x27;),
    q: root.querySelector(&#x27;#ee-q-value&#x27;)
  };
  let activeGuidance = null;

  // Specific heats in J/(g K); latent heats in J/g; temperatures in Celsius.
  const SUBSTANCES = {
    water: { name: &#x27;Water&#x27;, tStart: -20, tMelt: 0, tBoil: 100, tEnd: 120, cSolid: 2.09, cLiquid: 4.18, cGas: 2.01, hFus: 334, hVap: 2260 },
    ethanol: { name: &#x27;Ethanol&#x27;, tStart: -134, tMelt: -114, tBoil: 78.4, tEnd: 98.4, cSolid: 0.97, cLiquid: 2.44, cGas: 1.43, hFus: 108, hVap: 841 }
  };

  const guidanceByControl = {
    substance: {
      title: &#x27;Substance: theory&#x27;,
      text: &#x27;Every substance has its own melting point, boiling point, specific heats and latent heats. Water\&#x27;s unusually large heat of vaporisation is why sweating is such an effective cooling mechanism.&#x27;
    },
    mass: {
      title: &#x27;Sample mass: theory&#x27;,
      text: &#x27;Both the sloped (heating) and flat (phase-change) sections scale directly with mass: twice the sample needs twice the energy to reach the same temperature or complete the same phase change.&#x27;
    },
    q: {
      title: &#x27;Heat added: theory&#x27;,
      text: &#x27;Dragging this slider adds energy to the sample at constant pressure. Where the curve slopes, temperature rises; where it\&#x27;s flat, the sample is changing phase at a fixed temperature.&#x27;
    }
  };

  function defaultGuidance() {
    return {
      title: &#x27;Current graph: theory&#x27;,
      text: &#x27;On the sloped sections, &lt;em&gt;q = mc&amp;Delta;T&lt;/em&gt; (sensible heat) and entropy rises gradually, &lt;em&gt;&amp;Delta;S = mc&amp;nbsp;ln(T&amp;#x2082;/T&amp;#x2081;)&lt;/em&gt;. On the flat sections, &lt;em&gt;q = m&amp;Delta;H&lt;/em&gt; (latent heat) and entropy jumps at constant &lt;em&gt;T&lt;/em&gt;: &lt;em&gt;&amp;Delta;S = &amp;Delta;H/T&lt;/em&gt;.&#x27;
    };
  }

  function showGuidance(topic) {
    const content = guidanceByControl[topic] || defaultGuidance();
    guidanceTitle.textContent = content.title;
    guidance.innerHTML = content.text;
  }

  function restoreGuidance() {
    activeGuidance = null;
    showGuidance();
  }

  function buildSegments(sub, mass) {
    const segs = [];
    let q = 0;
    function addHeat(label, T0, T1, c) {
      const dq = mass * c * (T1 - T0) / 1000; // kJ
      segs.push({ type: &#x27;heat&#x27;, label, T0, T1, c, q0: q, q1: q + dq });
      q += dq;
    }
    function addPhase(label, T, H) {
      const dq = mass * H / 1000; // kJ
      segs.push({ type: &#x27;phase&#x27;, label, T, H, q0: q, q1: q + dq });
      q += dq;
    }
    addHeat(&#x27;Heating solid&#x27;, sub.tStart, sub.tMelt, sub.cSolid);
    addPhase(&#x27;Melting&#x27;, sub.tMelt, sub.hFus);
    addHeat(&#x27;Heating liquid&#x27;, sub.tMelt, sub.tBoil, sub.cLiquid);
    addPhase(&#x27;Vaporising&#x27;, sub.tBoil, sub.hVap);
    addHeat(&#x27;Heating gas&#x27;, sub.tBoil, sub.tEnd, sub.cGas);
    return segs;
  }

  function segmentAt(segs, q) {
    for (const seg of segs) {
      if (q &lt;= seg.q1 || seg === segs[segs.length - 1]) return seg;
    }
    return segs[segs.length - 1];
  }

  function tempAt(seg, q) {
    if (seg.type === &#x27;phase&#x27;) return seg.T;
    const frac = seg.q1 &gt; seg.q0 ? (q - seg.q0) / (seg.q1 - seg.q0) : 0;
    return seg.T0 + (seg.T1 - seg.T0) * Math.min(Math.max(frac, 0), 1);
  }

  function cumulativeEntropy(segs, q, mass) {
    let s = 0;
    for (const seg of segs) {
      if (q &gt;= seg.q1) {
        s += seg.type === &#x27;phase&#x27;
          ? mass * seg.H / (seg.T + 273.15)
          : mass * seg.c * Math.log((seg.T1 + 273.15) / (seg.T0 + 273.15));
      } else if (q &gt; seg.q0) {
        if (seg.type === &#x27;phase&#x27;) {
          s += (q - seg.q0) * 1000 / (seg.T + 273.15);
        } else {
          const tNow = tempAt(seg, q);
          s += mass * seg.c * Math.log((tNow + 273.15) / (seg.T0 + 273.15));
        }
        break;
      } else {
        break;
      }
    }
    return s; // J/K
  }

  function render() {
    const sub = SUBSTANCES[substanceSelect.value];
    const mass = Number(massInput.value);
    outputs.mass.textContent = `${mass} g`;

    const segs = buildSegments(sub, mass);
    const qTotal = segs[segs.length - 1].q1;
    qInput.max = String(Math.ceil(qTotal));
    const q = Math.min(Number(qInput.value), qTotal);
    qInput.value = String(q);
    outputs.q.textContent = `${q.toFixed(0)} kJ`;

    const bounds = root.querySelector(&#x27;.ee-chart-wrap&#x27;).getBoundingClientRect();
    const width = Math.max(320, Math.floor(bounds.width));
    const height = width &lt; 430 ? 360 : 440;
    const margin = { top: 70, right: 42, bottom: 76, left: 86 };

    const samples = [];
    const steps = 240;
    for (let i = 0; i &lt;= steps; i++) {
      const qi = qTotal * i / steps;
      samples.push({ x: qi, y: tempAt(segmentAt(segs, qi), qi) });
    }

    const x = d3.scaleLinear().domain([0, qTotal]).range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain([sub.tStart, sub.tEnd]).range([height - margin.bottom, margin.top]);
    const line = d3.line().x(d =&gt; x(d.x)).y(d =&gt; y(d.y));
    chart.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;preserveAspectRatio&#x27;, &#x27;xMidYMid meet&#x27;);
    chart.selectAll(&#x27;*&#x27;).remove();
    chart.append(&#x27;title&#x27;).attr(&#x27;id&#x27;, &#x27;ee-chart-title&#x27;).text(`${sub.name} heating curve`);
    chart.append(&#x27;desc&#x27;).attr(&#x27;id&#x27;, &#x27;ee-chart-desc&#x27;).text(&#x27;Temperature against cumulative heat added at constant pressure. Shaded bands mark phase changes, where temperature stays constant while enthalpy and entropy both increase.&#x27;);
    chart.append(&#x27;rect&#x27;).attr(&#x27;class&#x27;, &#x27;ee-frame&#x27;).attr(&#x27;x&#x27;, margin.left).attr(&#x27;y&#x27;, margin.top).attr(&#x27;width&#x27;, width - margin.left - margin.right).attr(&#x27;height&#x27;, height - margin.top - margin.bottom);

    segs.filter(s =&gt; s.type === &#x27;phase&#x27;).forEach(seg =&gt; {
      chart.append(&#x27;rect&#x27;).attr(&#x27;class&#x27;, &#x27;ee-phase-band&#x27;)
        .attr(&#x27;x&#x27;, x(seg.q0)).attr(&#x27;y&#x27;, margin.top)
        .attr(&#x27;width&#x27;, Math.max(1, x(seg.q1) - x(seg.q0))).attr(&#x27;height&#x27;, height - margin.top - margin.bottom);
    });

    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;ee-direct-label&#x27;).attr(&#x27;x&#x27;, margin.left).attr(&#x27;y&#x27;, 29).text(`${sub.name}, ${mass} g`);

    chart.append(&#x27;path&#x27;).datum(samples).attr(&#x27;class&#x27;, &#x27;ee-current&#x27;).attr(&#x27;d&#x27;, line);

    const curSeg = segmentAt(segs, q);
    const curT = tempAt(curSeg, q);
    chart.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;ee-guide&#x27;).attr(&#x27;x1&#x27;, x(q)).attr(&#x27;x2&#x27;, x(q)).attr(&#x27;y1&#x27;, margin.top).attr(&#x27;y2&#x27;, height - margin.bottom);
    chart.append(&#x27;circle&#x27;).attr(&#x27;class&#x27;, &#x27;ee-marker&#x27;).attr(&#x27;cx&#x27;, x(q)).attr(&#x27;cy&#x27;, y(curT)).attr(&#x27;r&#x27;, 6);

    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;ee-axis&#x27;).attr(&#x27;transform&#x27;, `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(width &lt; 430 ? 4 : 6));
    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;ee-axis&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(6));
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;ee-axis-title&#x27;).attr(&#x27;x&#x27;, (margin.left + width - margin.right) / 2).attr(&#x27;y&#x27;, height - 14).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Heat added, q (kJ)&#x27;);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;ee-axis-title&#x27;).attr(&#x27;transform&#x27;, `translate(21 ${(margin.top + height - margin.bottom) / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Temperature (°C)&#x27;);

    const sCum = cumulativeEntropy(segs, q, mass);
    if (curSeg.type === &#x27;phase&#x27;) {
      const dS = mass * curSeg.H / (curSeg.T + 273.15);
      status.textContent = `${curSeg.label} at ${curSeg.T.toFixed(1)} °C (constant). Full transition: ΔH ≈ ${(mass * curSeg.H / 1000).toFixed(1)} kJ, ΔS ≈ ${dS.toFixed(0)} J/K. Cumulative entropy so far: ≈ ${sCum.toFixed(0)} J/K.`;
    } else {
      status.textContent = `${curSeg.label}: T ≈ ${curT.toFixed(1)} °C. No phase change here — all the energy is sensible heat, raising temperature. Cumulative entropy so far: ≈ ${sCum.toFixed(0)} J/K.`;
    }
    if (!activeGuidance) showGuidance();
  }

  [substanceSelect, massInput, qInput].forEach(control =&gt; control.addEventListener(&#x27;input&#x27;, render));
  const controlsWithGuidance = [[substanceSelect, &#x27;substance&#x27;], [massInput, &#x27;mass&#x27;], [qInput, &#x27;q&#x27;]];
  controlsWithGuidance.forEach(([control, topic]) =&gt; {
    const label = control.closest(&#x27;label&#x27;);
    label.addEventListener(&#x27;mouseenter&#x27;, () =&gt; { activeGuidance = topic; showGuidance(topic); });
    label.addEventListener(&#x27;mouseleave&#x27;, restoreGuidance);
    control.addEventListener(&#x27;focus&#x27;, () =&gt; { activeGuidance = topic; showGuidance(topic); });
    control.addEventListener(&#x27;blur&#x27;, restoreGuidance);
  });
  new ResizeObserver(render).observe(root.querySelector(&#x27;.ee-chart-wrap&#x27;));
  render();
})();
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;
