    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;lc-explorer&quot;&gt;
  &lt;h2&gt;Le Chatelier&#x27;s principle explorer&lt;/h2&gt;
  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Equilibrium controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lc-mode&quot;&gt;Plot
      &lt;select id=&quot;lc-mode&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;pressure&quot;&gt;Effect of pressure (constant T)&lt;/option&gt;
        &lt;option value=&quot;temperature&quot;&gt;Effect of temperature (constant P)&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lc-p&quot;&gt;Total pressure &lt;output id=&quot;lc-p-value&quot; class=&quot;tabular-nums&quot;&gt;1.0 atm&lt;/output&gt;
      &lt;input id=&quot;lc-p&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0.1&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;lc-t&quot;&gt;Temperature &lt;output id=&quot;lc-t-value&quot; class=&quot;tabular-nums&quot;&gt;298 K&lt;/output&gt;
      &lt;input id=&quot;lc-t&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;250&quot; max=&quot;400&quot; step=&quot;2&quot; value=&quot;298&quot;&gt;
    &lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;lc-content&quot;&gt;
    &lt;div class=&quot;lc-chart-wrap&quot;&gt;&lt;svg id=&quot;lc-chart&quot; role=&quot;img&quot; aria-labelledby=&quot;lc-chart-title lc-chart-desc&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;aside class=&quot;lc-explanation&quot; aria-label=&quot;Plot interpretation&quot;&gt;
    &lt;h3&gt;How to interpret the plot&lt;/h3&gt;
    &lt;p&gt;N&amp;#x2082;O&amp;#x2084;(g) &amp;#x21CC; 2NO&amp;#x2082;(g), &amp;Delta;H&amp;deg; &amp;#x2248; +57.2 kJ mol&amp;#x207B;&amp;#xB9; (endothermic). Blue is the selected condition; dashed grey is a reference. The marker tracks the fraction of N&amp;#x2082;O&amp;#x2084; dissociated, &amp;alpha;.&lt;/p&gt;
    &lt;h3 id=&quot;lc-guidance-title&quot;&gt;Current graph: theory&lt;/h3&gt;
    &lt;p id=&quot;lc-guidance&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;p id=&quot;lc-status&quot; class=&quot;lc-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;/aside&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #lc-explorer { color: var(--foreground); }
  #lc-explorer .viz-controls { align-items: end; gap: 14px; }
  #lc-explorer .form-label { min-width: 155px; flex: 1 1 155px; }
  #lc-explorer output { float: right; max-width: 100%; overflow-wrap: anywhere; color: var(--muted-foreground); }
  #lc-explorer .lc-content { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(230px, .8fr); gap: 18px; align-items: stretch; margin-top: 14px; }
  #lc-explorer .lc-chart-wrap { width: 100%; grid-column: 1; grid-row: 1; }
  #lc-explorer svg { width: 100%; height: 440px; display: block; }
  #lc-explorer .lc-axis { color: var(--foreground); }
  #lc-explorer .lc-axis path, #lc-explorer .lc-axis line { stroke: var(--border); }
  #lc-explorer .lc-axis text { fill: var(--foreground); font-size: 15px; }
  #lc-explorer .lc-axis-title, #lc-explorer .lc-direct-label { fill: var(--foreground); font-size: 16px; }
  #lc-explorer .lc-reference { fill: none; stroke: var(--muted-foreground); stroke-width: 2; stroke-dasharray: 5 4; }
  #lc-explorer .lc-current { fill: none; stroke: var(--viz-series-1); stroke-width: 3; }
  #lc-explorer .lc-guide { stroke: var(--destructive); stroke-width: 1.5; stroke-dasharray: 4 4; }
  #lc-explorer .lc-marker { fill: var(--viz-series-1); stroke: var(--card); stroke-width: 2; }
  #lc-explorer .lc-frame { fill: none; stroke: var(--border); }
  #lc-explorer .lc-explanation { grid-column: 2; grid-row: 1; align-self: center; padding: 12px 14px; border-left: 4px solid var(--viz-series-1); background: var(--muted); }
  #lc-explorer .lc-explanation h3 { margin: 0 0 6px; font-size: 18px; }
  #lc-explorer .lc-explanation h3:not(:first-child) { margin-top: 14px; }
  #lc-explorer .lc-explanation p { margin: 6px 0 0; font-size: 16px; line-height: 1.5; }
  #lc-explorer .lc-result { font-weight: 600; }
  @media (max-width: 680px) { #lc-explorer .lc-content { grid-template-columns: 1fr; } #lc-explorer .lc-chart-wrap, #lc-explorer .lc-explanation { grid-column: 1; grid-row: auto; } }
  @media (max-width: 420px) { #lc-explorer svg { height: 360px; } }
&lt;/style&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;lc-explorer&#x27;);
  const chart = d3.select(root.querySelector(&#x27;#lc-chart&#x27;));
  const mode = root.querySelector(&#x27;#lc-mode&#x27;);
  const pInput = root.querySelector(&#x27;#lc-p&#x27;);
  const tInput = root.querySelector(&#x27;#lc-t&#x27;);
  const status = root.querySelector(&#x27;#lc-status&#x27;);
  const guidanceTitle = root.querySelector(&#x27;#lc-guidance-title&#x27;);
  const guidance = root.querySelector(&#x27;#lc-guidance&#x27;);
  const outputs = {
    p: root.querySelector(&#x27;#lc-p-value&#x27;),
    t: root.querySelector(&#x27;#lc-t-value&#x27;)
  };
  const R = 8.314;
  const KP_298 = 0.144; // atm, N2O4 &lt;=&gt; 2NO2 at 298.15 K
  const DH = 57200; // J/mol
  const T_REF = 298.15;
  const N = 220;
  const P_MIN = 0.1, P_MAX = 5;
  const T_MIN = 250, T_MAX = 400;
  const REF_P = 1, REF_T = 298;
  let activeGuidance = null;

  function kp(T) {
    return KP_298 * Math.exp(-DH / R * (1 / T - 1 / T_REF));
  }
  function alpha(Kp, P) {
    return Math.sqrt(Kp / (4 * P + Kp));
  }

  const guidanceByControl = {
    mode: {
      title: &#x27;Plot type: theory&#x27;,
      text: &#x27;Both curves come from the same equilibrium, just varying a different stress. Pressure changes the position without changing &lt;em&gt;K&lt;/em&gt;&lt;sub&gt;p&lt;/sub&gt;; temperature changes &lt;em&gt;K&lt;/em&gt;&lt;sub&gt;p&lt;/sub&gt; itself through the van\&#x27;t Hoff relationship.&#x27;
    },
    p: {
      title: &#x27;Pressure: theory&#x27;,
      text: &#x27;Compressing the system (higher P) favours the side with fewer gas moles &amp;mdash; N&amp;#x2082;O&amp;#x2084;, 1 mole vs. 2. Le Chatelier: the equilibrium shifts left, so &amp;alpha; falls as pressure rises.&#x27;
    },
    t: {
      title: &#x27;Temperature: theory&#x27;,
      text: &#x27;This reaction is endothermic (&amp;Delta;H&amp;deg; &amp;gt; 0), so heat behaves like a reactant. Le Chatelier: raising &lt;em&gt;T&lt;/em&gt; shifts the equilibrium right (more NO&amp;#x2082;), raising &amp;alpha;. Formally, &lt;em&gt;K&lt;/em&gt;&lt;sub&gt;p&lt;/sub&gt; increases with &lt;em&gt;T&lt;/em&gt; via the van\&#x27;t Hoff equation.&#x27;
    }
  };

  function defaultGuidance() {
    if (mode.value === &#x27;pressure&#x27;) {
      return { title: &#x27;Current graph: theory&#x27;, text: &#x27;&amp;alpha; = &amp;radic;(&lt;em&gt;K&lt;/em&gt;&lt;sub&gt;p&lt;/sub&gt; / (4&lt;em&gt;P&lt;/em&gt; + &lt;em&gt;K&lt;/em&gt;&lt;sub&gt;p&lt;/sub&gt;)) at fixed &lt;em&gt;T&lt;/em&gt;. Increasing pressure compresses the gas mixture toward the side with fewer moles, N&amp;#x2082;O&amp;#x2084;, so &amp;alpha; decreases.&#x27; };
    }
    return { title: &#x27;Current graph: theory&#x27;, text: &#x27;&lt;em&gt;K&lt;/em&gt;&lt;sub&gt;p&lt;/sub&gt;(&lt;em&gt;T&lt;/em&gt;) grows exponentially with temperature for this endothermic reaction, so &amp;alpha; rises sharply as &lt;em&gt;T&lt;/em&gt; increases at fixed pressure.&#x27; };
  }

  function showGuidance(topic) {
    const content = guidanceByControl[topic] || defaultGuidance();
    guidanceTitle.textContent = content.title;
    guidance.innerHTML = content.text;
  }

  function restoreGuidance() {
    activeGuidance = null;
    showGuidance();
  }

  function render() {
    const P = Number(pInput.value);
    const T = Number(tInput.value);
    const m = mode.value;
    outputs.p.textContent = `${P.toFixed(1)} atm`;
    outputs.t.textContent = `${T} K`;

    // Both sliders stay visible in both modes: pressure always feeds the
    // dissociation formula and temperature always sets Kp. The &quot;mode&quot; only
    // decides which one is also the chart&#x27;s x-axis / marker.

    const bounds = root.querySelector(&#x27;.lc-chart-wrap&#x27;).getBoundingClientRect();
    const width = Math.max(320, Math.floor(bounds.width));
    const height = width &lt; 430 ? 360 : 440;
    const margin = { top: 70, right: 42, bottom: 76, left: 86 };
    const compact = width &lt; 500;

    let xMin, xMax, xLabel, currentFn, referenceFn, currentLabel, referenceLabel, statusText, markerX;

    if (m === &#x27;pressure&#x27;) {
      xMin = P_MIN; xMax = P_MAX; xLabel = &#x27;Total pressure (atm)&#x27;;
      const K = kp(T);
      currentFn = (p) =&gt; alpha(K, p);
      referenceFn = (p) =&gt; alpha(kp(REF_T), p);
      currentLabel = compact ? `T = ${T} K` : `T = ${T} K (K_p = ${K.toFixed(2)} atm)`;
      referenceLabel = compact ? `Reference: 298 K` : `Reference: T = 298 K`;
      markerX = P;
      const a = alpha(K, P);
      const pN2O4 = P * (1 - a) / (1 + a);
      const pNO2 = P * 2 * a / (1 + a);
      statusText = `At P = ${P.toFixed(1)} atm: α ≈ ${(a * 100).toFixed(1)}% dissociated. P(N₂O₄) ≈ ${pN2O4.toFixed(2)} atm, P(NO₂) ≈ ${pNO2.toFixed(2)} atm. Raising pressure would shift the equilibrium toward N₂O₄ (fewer moles of gas).`;
    } else {
      xMin = T_MIN; xMax = T_MAX; xLabel = &#x27;Temperature (K)&#x27;;
      currentFn = (t) =&gt; alpha(kp(t), P);
      referenceFn = (t) =&gt; alpha(kp(t), REF_P);
      currentLabel = compact ? `P = ${P.toFixed(1)} atm` : `P = ${P.toFixed(1)} atm`;
      referenceLabel = compact ? `Reference: 1 atm` : `Reference: P = 1 atm`;
      markerX = T;
      const K = kp(T);
      const a = alpha(K, P);
      statusText = `At T = ${T} K: K_p ≈ ${K.toFixed(2)} atm, α ≈ ${(a * 100).toFixed(1)}% dissociated. Raising temperature would shift the equilibrium toward NO₂ (this reaction is endothermic).`;
    }

    const xs = d3.range(N + 1).map(i =&gt; xMin + i * (xMax - xMin) / N);
    const current = xs.map(x =&gt; ({ x, y: currentFn(x) }));
    const reference = xs.map(x =&gt; ({ x, y: referenceFn(x) }));

    const x = d3.scaleLinear().domain([xMin, xMax]).range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain([0, 1]).range([height - margin.bottom, margin.top]);
    const line = d3.line().x(d =&gt; x(d.x)).y(d =&gt; y(d.y));
    chart.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;preserveAspectRatio&#x27;, &#x27;xMidYMid meet&#x27;);
    chart.selectAll(&#x27;*&#x27;).remove();
    const titles = { pressure: &#x27;Fraction dissociated vs pressure&#x27;, temperature: &#x27;Fraction dissociated vs temperature&#x27; };
    chart.append(&#x27;title&#x27;).attr(&#x27;id&#x27;, &#x27;lc-chart-title&#x27;).text(titles[m]);
    chart.append(&#x27;desc&#x27;).attr(&#x27;id&#x27;, &#x27;lc-chart-desc&#x27;).text(&#x27;The solid curve shows the fraction of N2O4 dissociated to NO2 at equilibrium for the selected condition. The dashed curve is a reference condition. The marker shows the current value.&#x27;);
    chart.append(&#x27;rect&#x27;).attr(&#x27;class&#x27;, &#x27;lc-frame&#x27;).attr(&#x27;x&#x27;, margin.left).attr(&#x27;y&#x27;, margin.top).attr(&#x27;width&#x27;, width - margin.left - margin.right).attr(&#x27;height&#x27;, height - margin.top - margin.bottom);

    chart.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;lc-current&#x27;).attr(&#x27;x1&#x27;, margin.left).attr(&#x27;x2&#x27;, margin.left + 28).attr(&#x27;y1&#x27;, 23).attr(&#x27;y2&#x27;, 23);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;lc-direct-label&#x27;).attr(&#x27;x&#x27;, margin.left + 36).attr(&#x27;y&#x27;, 29).text(currentLabel);
    chart.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;lc-reference&#x27;).attr(&#x27;x1&#x27;, margin.left).attr(&#x27;x2&#x27;, margin.left + 28).attr(&#x27;y1&#x27;, 49).attr(&#x27;y2&#x27;, 49);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;lc-direct-label&#x27;).attr(&#x27;x&#x27;, margin.left + 36).attr(&#x27;y&#x27;, 55).text(referenceLabel);

    chart.append(&#x27;path&#x27;).datum(reference).attr(&#x27;class&#x27;, &#x27;lc-reference&#x27;).attr(&#x27;d&#x27;, line);
    chart.append(&#x27;path&#x27;).datum(current).attr(&#x27;class&#x27;, &#x27;lc-current&#x27;).attr(&#x27;d&#x27;, line);

    const markerY = currentFn(markerX);
    chart.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;lc-guide&#x27;).attr(&#x27;x1&#x27;, x(markerX)).attr(&#x27;x2&#x27;, x(markerX)).attr(&#x27;y1&#x27;, margin.top).attr(&#x27;y2&#x27;, height - margin.bottom);
    chart.append(&#x27;circle&#x27;).attr(&#x27;class&#x27;, &#x27;lc-marker&#x27;).attr(&#x27;cx&#x27;, x(markerX)).attr(&#x27;cy&#x27;, y(markerY)).attr(&#x27;r&#x27;, 6);

    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;lc-axis&#x27;).attr(&#x27;transform&#x27;, `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(width &lt; 430 ? 4 : 6));
    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;lc-axis&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format(&#x27;.0%&#x27;)));
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;lc-axis-title&#x27;).attr(&#x27;x&#x27;, (margin.left + width - margin.right) / 2).attr(&#x27;y&#x27;, height - 14).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(xLabel);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;lc-axis-title&#x27;).attr(&#x27;transform&#x27;, `translate(21 ${(margin.top + height - margin.bottom) / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Fraction dissociated, α&#x27;);

    status.textContent = statusText;
    if (!activeGuidance) showGuidance();
  }

  [mode, pInput, tInput].forEach(control =&gt; control.addEventListener(&#x27;input&#x27;, render));
  const controlsWithGuidance = [[mode, &#x27;mode&#x27;], [pInput, &#x27;p&#x27;], [tInput, &#x27;t&#x27;]];
  controlsWithGuidance.forEach(([control, topic]) =&gt; {
    const label = control.closest(&#x27;label&#x27;);
    label.addEventListener(&#x27;mouseenter&#x27;, () =&gt; { activeGuidance = topic; showGuidance(topic); });
    label.addEventListener(&#x27;mouseleave&#x27;, restoreGuidance);
    control.addEventListener(&#x27;focus&#x27;, () =&gt; { activeGuidance = topic; showGuidance(topic); });
    control.addEventListener(&#x27;blur&#x27;, restoreGuidance);
  });
  new ResizeObserver(render).observe(root.querySelector(&#x27;.lc-chart-wrap&#x27;));
  render();
})();
&lt;/script&gt;
