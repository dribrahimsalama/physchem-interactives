  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;gl-explorer&quot;&gt;

      &lt;input id=&quot;gl-t&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;200&quot; max=&quot;500&quot; step=&quot;2&quot; value=&quot;298&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;gl-p&quot;&gt;Pressure &lt;output id=&quot;gl-p-value&quot; class=&quot;tabular-nums&quot;&gt;1.0 atm&lt;/output&gt;
      &lt;input id=&quot;gl-p&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0.5&quot; max=&quot;5&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;gl-v&quot;&gt;Volume &lt;output id=&quot;gl-v-value&quot; class=&quot;tabular-nums&quot;&gt;22 L&lt;/output&gt;
      &lt;input id=&quot;gl-v&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;5&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;22&quot;&gt;

&lt;style&gt;
  #gl-explorer { color: var(--foreground); }
  #gl-explorer .viz-controls { align-items: end; gap: 14px; }

  #gl-explorer output { float: right; max-width: 100%; overflow-wrap: anywhere; color: var(--muted-foreground); }
  #gl-explorer .gl-content { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(230px, .8fr); gap: 18px; align-items: stretch; margin-top: 14px; }
  #gl-explorer .gl-chart-wrap { width: 100%; grid-column: 1; grid-row: 1; }
  #gl-explorer svg { width: 100%; height: 440px; display: block; }
  #gl-explorer .gl-axis { color: var(--foreground); }
  #gl-explorer .gl-axis path, #gl-explorer .gl-axis line { stroke: var(--border); }
  #gl-explorer .gl-axis text { fill: var(--foreground); font-size: 15px; }

  #gl-explorer .gl-current { fill: none; stroke: var(--viz-series-1); stroke-width: 3; }
  #gl-explorer .gl-frame { fill: none; stroke: var(--border); }
  #gl-explorer .gl-explanation { grid-column: 2; grid-row: 1; align-self: center; padding: 12px 14px; border-left: 4px solid var(--viz-series-1); background: var(--muted); }
  #gl-explorer .gl-explanation h3 { margin: 0 0 6px; font-size: 18px; }
  #gl-explorer .gl-explanation h3:not(:first-child) { margin-top: 14px; }
  #gl-explorer .gl-explanation p { margin: 6px 0 0; font-size: 16px; line-height: 1.5; }

  @media (max-width: 680px) { #gl-explorer .gl-content { grid-template-columns: 1fr; } #gl-explorer .gl-chart-wrap, #gl-explorer .gl-explanation { grid-column: 1; grid-row: auto; } }
  @media (max-width: 420px) { #gl-explorer svg { height: 360px; } }
&lt;/style&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;gl-explorer&#x27;);
  const chart = d3.select(root.querySelector(&#x27;#gl-chart&#x27;));
  const mode = root.querySelector(&#x27;#gl-mode&#x27;);
  const nInput = root.querySelector(&#x27;#gl-n&#x27;);
  const tInput = root.querySelector(&#x27;#gl-t&#x27;);
  const pInput = root.querySelector(&#x27;#gl-p&#x27;);
  const vInput = root.querySelector(&#x27;#gl-v&#x27;);
  const status = root.querySelector(&#x27;#gl-status&#x27;);
  const guidanceTitle = root.querySelector(&#x27;#gl-guidance-title&#x27;);
  const guidance = root.querySelector(&#x27;#gl-guidance&#x27;);
  const outputs = {
    n: root.querySelector(&#x27;#gl-n-value&#x27;),
    t: root.querySelector(&#x27;#gl-t-value&#x27;),
    p: root.querySelector(&#x27;#gl-p-value&#x27;),
    v: root.querySelector(&#x27;#gl-v-value&#x27;)
  };
  const R = 0.08206; // L atm / (mol K)
  const N = 200;
  const T_MIN = 200, T_MAX = 500;
  const V_MIN = 1, V_MAX = 50;
  const REF_N = 1, REF_T = 298, REF_P = 1, REF_V = 22.4;
  let activeGuidance = null;

  const guidanceByControl = {
    mode: {
      title: &#x27;Plot type: theory&#x27;,
      text: &#x27;All three curves come from the same combined gas law, &lt;em&gt;PV = nRT&lt;/em&gt;. Each classical law holds two of P, V, T, n fixed and relates the other two: Boyle\&#x27;s (constant T, n), Charles\&#x27;s (constant P, n), Gay-Lussac\&#x27;s (constant V, n).&#x27;
    },
    n: {
      title: &#x27;Amount of gas: theory&#x27;,
      text: &#x27;More gas particles collide with the container walls more often. At fixed volume and temperature this raises pressure; to keep pressure fixed instead, the gas needs more volume.&#x27;
    },
    t: {
      title: &#x27;Temperature: theory&#x27;,
      text: &#x27;Raising &lt;em&gt;T&lt;/em&gt; increases the average kinetic energy of the gas particles, so at constant volume they strike the walls harder and more often &amp;mdash; raising pressure.&#x27;
    },
    p: {
      title: &#x27;Pressure: theory&#x27;,
      text: &#x27;Holding a gas at a higher fixed pressure means a given temperature rise produces less volume change than it would at a lower fixed pressure.&#x27;
    },
    v: {
      title: &#x27;Volume: theory&#x27;,
      text: &#x27;A smaller fixed volume concentrates the same number of collisions into less space, so pressure rises faster with temperature than in a larger container.&#x27;
    }
  };

  function defaultGuidance() {
    if (mode.value === &#x27;boyle&#x27;) {
      return { title: &#x27;Current graph: theory&#x27;, text: &#x27;&lt;em&gt;P &amp;prop; 1/V&lt;/em&gt; at constant &lt;em&gt;T&lt;/em&gt; and &lt;em&gt;n&lt;/em&gt; (Boyle\&#x27;s Law). Compressing a gas at constant temperature raises its pressure.&#x27; };
    }
    if (mode.value === &#x27;charles&#x27;) {
      return { title: &#x27;Current graph: theory&#x27;, text: &#x27;&lt;em&gt;V &amp;prop; T&lt;/em&gt; at constant &lt;em&gt;P&lt;/em&gt; and &lt;em&gt;n&lt;/em&gt; (Charles\&#x27;s Law). Heating a gas at constant pressure makes it expand.&#x27; };
    }
    return { title: &#x27;Current graph: theory&#x27;, text: &#x27;&lt;em&gt;P &amp;prop; T&lt;/em&gt; at constant &lt;em&gt;V&lt;/em&gt; and &lt;em&gt;n&lt;/em&gt; (Gay-Lussac\&#x27;s Law). Heating a gas in a sealed, rigid container raises its pressure.&#x27; };
  }

  function showGuidance(topic) {
    const content = guidanceByControl[topic] || defaultGuidance();
    guidanceTitle.textContent = content.title;
    guidance.innerHTML = content.text;
  }

  function restoreGuidance() {
    activeGuidance = null;
    showGuidance();
  }

  function pressure(n, T, V) { return n * R * T / V; }
  function volume(n, T, P) { return n * R * T / P; }

  function trapzMax(values) { return d3.max(values); }

  function render() {
    const n = Number(nInput.value);
    const T = Number(tInput.value);
    const P = Number(pInput.value);
    const V = Number(vInput.value);
    const m = mode.value;
    outputs.n.textContent = `${n.toFixed(1)} mol`;
    outputs.t.textContent = `${T} K`;
    outputs.p.textContent = `${P.toFixed(1)} atm`;
    outputs.v.textContent = `${V} L`;

    tInput.closest(&#x27;label&#x27;).style.display = m === &#x27;boyle&#x27; ? &#x27;&#x27; : &#x27;none&#x27;;
    pInput.closest(&#x27;label&#x27;).style.display = m === &#x27;charles&#x27; ? &#x27;&#x27; : &#x27;none&#x27;;
    vInput.closest(&#x27;label&#x27;).style.display = m === &#x27;gaylussac&#x27; ? &#x27;&#x27; : &#x27;none&#x27;;

    const bounds = root.querySelector(&#x27;.gl-chart-wrap&#x27;).getBoundingClientRect();
    const width = Math.max(320, Math.floor(bounds.width));
    const height = width &lt; 430 ? 360 : 440;
    const margin = { top: 70, right: 42, bottom: 76, left: 86 };

    let xMax, xLabel, yLabel, currentFn, referenceFn, currentLabel, referenceLabel, statusText;
    const compact = width &lt; 500;

    if (m === &#x27;boyle&#x27;) {
      xMax = V_MAX;
      xLabel = &#x27;Volume (L)&#x27;;
      yLabel = &#x27;Pressure (atm)&#x27;;
      currentFn = (v) =&gt; pressure(n, T, Math.max(v, V_MIN));
      referenceFn = (v) =&gt; pressure(REF_N, REF_T, Math.max(v, V_MIN));
      currentLabel = `n = ${n.toFixed(1)} mol, T = ${T} K`;
      referenceLabel = compact ? `Reference: 1 mol, 298 K` : `Reference: n = 1 mol, T = 298 K`;
      const repV = 10;
      const repP = pressure(n, T, repV);
      statusText = `At V = ${repV} L: P ≈ ${repP.toFixed(2)} atm. Doubling V would halve P (P ∝ 1/V).`;
    } else if (m === &#x27;charles&#x27;) {
      xMax = T_MAX;
      xLabel = &#x27;Temperature (K)&#x27;;
      yLabel = &#x27;Volume (L)&#x27;;
      currentFn = (t) =&gt; volume(n, Math.max(t, 1), P);
      referenceFn = (t) =&gt; volume(REF_N, Math.max(t, 1), REF_P);
      currentLabel = `n = ${n.toFixed(1)} mol, P = ${P.toFixed(1)} atm`;
      referenceLabel = compact ? `Reference: 1 mol, 1 atm` : `Reference: n = 1 mol, P = 1 atm`;
      const repT = 350;
      const repV2 = volume(n, repT, P);
      statusText = `At T = ${repT} K: V ≈ ${repV2.toFixed(1)} L. Doubling T would double V (V ∝ T).`;
    } else {
      xMax = T_MAX;
      xLabel = &#x27;Temperature (K)&#x27;;
      yLabel = &#x27;Pressure (atm)&#x27;;
      currentFn = (t) =&gt; pressure(n, Math.max(t, 1), V);
      referenceFn = (t) =&gt; pressure(REF_N, Math.max(t, 1), REF_V);
      currentLabel = `n = ${n.toFixed(1)} mol, V = ${V} L`;
      referenceLabel = compact ? `Reference: 1 mol, 22.4 L` : `Reference: n = 1 mol, V = 22.4 L`;
      const repT2 = 350;
      const repP2 = pressure(n, repT2, V);
      statusText = `At T = ${repT2} K: P ≈ ${repP2.toFixed(2)} atm. Doubling T would double P (P ∝ T).`;
    }

    const xMin = m === &#x27;boyle&#x27; ? V_MIN : T_MIN;
    const xs = d3.range(N + 1).map(i =&gt; xMin + i * (xMax - xMin) / N);
    const current = xs.map(x =&gt; ({ x, y: currentFn(x) }));
    const reference = xs.map(x =&gt; ({ x, y: referenceFn(x) }));
    const yMax = Math.max(trapzMax(current.map(d =&gt; d.y)), trapzMax(reference.map(d =&gt; d.y))) * 1.1;

    const x = d3.scaleLinear().domain([xMin, xMax]).range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain([0, yMax]).range([height - margin.bottom, margin.top]);
    const line = d3.line().x(d =&gt; x(d.x)).y(d =&gt; y(d.y));
    chart.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;preserveAspectRatio&#x27;, &#x27;xMidYMid meet&#x27;);
    chart.selectAll(&#x27;*&#x27;).remove();
    const titles = { boyle: &quot;Pressure vs volume at constant temperature&quot;, charles: &quot;Volume vs temperature at constant pressure&quot;, gaylussac: &quot;Pressure vs temperature at constant volume&quot; };
    chart.append(&#x27;title&#x27;).attr(&#x27;id&#x27;, &#x27;gl-chart-title&#x27;).text(titles[m]);
    chart.append(&#x27;desc&#x27;).attr(&#x27;id&#x27;, &#x27;gl-chart-desc&#x27;).text(`The solid curve shows the selected condition. The dashed curve is a reference condition of 1 mole at standard temperature or pressure.`);
    chart.append(&#x27;rect&#x27;).attr(&#x27;class&#x27;, &#x27;gl-frame&#x27;).attr(&#x27;x&#x27;, margin.left).attr(&#x27;y&#x27;, margin.top).attr(&#x27;width&#x27;, width - margin.left - margin.right).attr(&#x27;height&#x27;, height - margin.top - margin.bottom);
    chart.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;gl-current&#x27;).attr(&#x27;x1&#x27;, margin.left).attr(&#x27;x2&#x27;, margin.left + 28).attr(&#x27;y1&#x27;, 23).attr(&#x27;y2&#x27;, 23);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;gl-direct-label&#x27;).attr(&#x27;x&#x27;, margin.left + 36).attr(&#x27;y&#x27;, 29).text(currentLabel);
    chart.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;gl-reference&#x27;).attr(&#x27;x1&#x27;, margin.left).attr(&#x27;x2&#x27;, margin.left + 28).attr(&#x27;y1&#x27;, 49).attr(&#x27;y2&#x27;, 49);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;gl-direct-label&#x27;).attr(&#x27;x&#x27;, margin.left + 36).attr(&#x27;y&#x27;, 55).text(referenceLabel);
    chart.append(&#x27;path&#x27;).datum(reference).attr(&#x27;class&#x27;, &#x27;gl-reference&#x27;).attr(&#x27;d&#x27;, line);
    chart.append(&#x27;path&#x27;).datum(current).attr(&#x27;class&#x27;, &#x27;gl-current&#x27;).attr(&#x27;d&#x27;, line);
    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;gl-axis&#x27;).attr(&#x27;transform&#x27;, `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(width &lt; 430 ? 4 : 6));
    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;gl-axis&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5));
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;gl-axis-title&#x27;).attr(&#x27;x&#x27;, (margin.left + width - margin.right) / 2).attr(&#x27;y&#x27;, height - 14).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(xLabel);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;gl-axis-title&#x27;).attr(&#x27;transform&#x27;, `translate(21 ${(margin.top + height - margin.bottom) / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(yLabel);

    status.textContent = statusText;
    if (!activeGuidance) showGuidance();
  }

  [mode, nInput, tInput, pInput, vInput].forEach(control =&gt; control.addEventListener(&#x27;input&#x27;, render));
  const controlsWithGuidance = [[mode, &#x27;mode&#x27;], [nInput, &#x27;n&#x27;], [tInput, &#x27;t&#x27;], [pInput, &#x27;p&#x27;], [vInput, &#x27;v&#x27;]];
  controlsWithGuidance.forEach(([control, topic]) =&gt; {
    const label = control.closest(&#x27;label&#x27;);
    label.addEventListener(&#x27;mouseenter&#x27;, () =&gt; { activeGuidance = topic; showGuidance(topic); });
    label.addEventListener(&#x27;mouseleave&#x27;, restoreGuidance);
    control.addEventListener(&#x27;focus&#x27;, () =&gt; { activeGuidance = topic; showGuidance(topic); });
    control.addEventListener(&#x27;blur&#x27;, restoreGuidance);
  });
  new ResizeObserver(render).observe(root.querySelector(&#x27;.gl-chart-wrap&#x27;));
  render();
})();
&lt;/script&gt;
