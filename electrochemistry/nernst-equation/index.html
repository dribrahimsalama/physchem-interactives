  background-position:

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;nq-explorer&quot;&gt;
  &lt;h2&gt;Nernst equation explorer&lt;/h2&gt;
  &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Galvanic cell controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;nq-cell&quot;&gt;Cell
      &lt;select id=&quot;nq-cell&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;zncu&quot;&gt;Zn | Zn&amp;#xB2;&amp;#x207A; &amp;#x2225; Cu&amp;#xB2;&amp;#x207A; | Cu (E&amp;deg; = 1.10 V)&lt;/option&gt;
        &lt;option value=&quot;znag&quot;&gt;Zn | Zn&amp;#xB2;&amp;#x207A; &amp;#x2225; Ag&amp;#x207A; | Ag (E&amp;deg; = 1.56 V)&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;nq-zn&quot;&gt;[Zn&amp;#xB2;&amp;#x207A;] &lt;output id=&quot;nq-zn-value&quot; class=&quot;tabular-nums&quot;&gt;1.00 M&lt;/output&gt;
      &lt;input id=&quot;nq-zn&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-3&quot; max=&quot;0.3&quot; step=&quot;0.1&quot; value=&quot;0&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;nq-ox&quot;&gt;[Cu&amp;#xB2;&amp;#x207A;] &lt;output id=&quot;nq-ox-value&quot; class=&quot;tabular-nums&quot;&gt;1.00 M&lt;/output&gt;
      &lt;input id=&quot;nq-ox&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-3&quot; max=&quot;0.3&quot; step=&quot;0.1&quot; value=&quot;0&quot;&gt;
    &lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;nq-content&quot;&gt;
    &lt;div class=&quot;nq-chart-wrap&quot;&gt;&lt;svg id=&quot;nq-chart&quot; role=&quot;img&quot; aria-labelledby=&quot;nq-chart-title nq-chart-desc&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;aside class=&quot;nq-explanation&quot; aria-label=&quot;Plot interpretation&quot;&gt;
    &lt;h3&gt;How to interpret the plot&lt;/h3&gt;
    &lt;p&gt;The line is this cell&#x27;s Nernst equation at 25&amp;nbsp;&amp;deg;C. Blue marks the cell potential at your chosen concentrations; the open circle marks standard conditions (Q = 1, E = E&amp;deg;).&lt;/p&gt;
    &lt;h3 id=&quot;nq-guidance-title&quot;&gt;Current graph: theory&lt;/h3&gt;
    &lt;p id=&quot;nq-guidance&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;p id=&quot;nq-status&quot; class=&quot;nq-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;/aside&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;style&gt;
  #nq-explorer { color: var(--foreground); }
  #nq-explorer .viz-controls { align-items: end; gap: 14px; }
  #nq-explorer .form-label { min-width: 155px; flex: 1 1 155px; }
  #nq-explorer output { float: right; max-width: 100%; overflow-wrap: anywhere; color: var(--muted-foreground); }
  #nq-explorer .nq-content { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(230px, .8fr); gap: 18px; align-items: stretch; margin-top: 14px; }
  #nq-explorer .nq-chart-wrap { width: 100%; grid-column: 1; grid-row: 1; }
  #nq-explorer svg { width: 100%; height: 440px; display: block; }
  #nq-explorer .nq-axis { color: var(--foreground); }
  #nq-explorer .nq-axis path, #nq-explorer .nq-axis line { stroke: var(--border); }
  #nq-explorer .nq-axis text { fill: var(--foreground); font-size: 15px; }
  #nq-explorer .nq-axis-title, #nq-explorer .nq-direct-label { fill: var(--foreground); font-size: 16px; }
  #nq-explorer .nq-current { fill: none; stroke: var(--viz-series-1); stroke-width: 3; }
  #nq-explorer .nq-guide { stroke: var(--destructive); stroke-width: 1.5; stroke-dasharray: 4 4; }
  #nq-explorer .nq-marker { fill: var(--viz-series-1); stroke: var(--card); stroke-width: 2; }
  #nq-explorer .nq-standard { fill: var(--card); stroke: var(--foreground); stroke-width: 2; }
  #nq-explorer .nq-frame { fill: none; stroke: var(--border); }
  #nq-explorer .nq-explanation { grid-column: 2; grid-row: 1; align-self: center; padding: 12px 14px; border-left: 4px solid var(--viz-series-1); background: var(--muted); }
  #nq-explorer .nq-explanation h3 { margin: 0 0 6px; font-size: 18px; }
  #nq-explorer .nq-explanation h3:not(:first-child) { margin-top: 14px; }
  #nq-explorer .nq-explanation p { margin: 6px 0 0; font-size: 16px; line-height: 1.5; }
  #nq-explorer .nq-result { font-weight: 600; }
  @media (max-width: 680px) { #nq-explorer .nq-content { grid-template-columns: 1fr; } #nq-explorer .nq-chart-wrap, #nq-explorer .nq-explanation { grid-column: 1; grid-row: auto; } }
  @media (max-width: 420px) { #nq-explorer svg { height: 360px; } }
&lt;/style&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;nq-explorer&#x27;);
  const chart = d3.select(root.querySelector(&#x27;#nq-chart&#x27;));
  const cellSelect = root.querySelector(&#x27;#nq-cell&#x27;);
  const znInput = root.querySelector(&#x27;#nq-zn&#x27;);
  const oxInput = root.querySelector(&#x27;#nq-ox&#x27;);
  const oxLabel = root.querySelector(&#x27;label[for=&quot;nq-ox&quot;]&#x27;);
  const status = root.querySelector(&#x27;#nq-status&#x27;);
  const guidanceTitle = root.querySelector(&#x27;#nq-guidance-title&#x27;);
  const guidance = root.querySelector(&#x27;#nq-guidance&#x27;);
  const outputs = {
    zn: root.querySelector(&#x27;#nq-zn-value&#x27;),
    ox: root.querySelector(&#x27;#nq-ox-value&#x27;)
  };
  const LOGQ_MIN = -6, LOGQ_MAX = 6;
  const N = 200;
  let activeGuidance = null;

  const CELLS = {
    zncu: { e0: 1.10, n: 2, oxName: &#x27;Cu²⁺&#x27;, oxCoeff: 1, oxLabel: &#x27;[Cu²⁺]&#x27;, qLabel: &#x27;Q = [Zn²⁺] / [Cu²⁺]&#x27; },
    znag: { e0: 1.56, n: 2, oxName: &#x27;Ag⁺&#x27;, oxCoeff: 2, oxLabel: &#x27;[Ag⁺]&#x27;, qLabel: &#x27;Q = [Zn²⁺] / [Ag⁺]²&#x27; }
  };

  function formatConc(v) {
    if (v &gt;= 0.01) return `${v.toFixed(v &gt;= 1 ? 2 : 3)} M`;
    const exp = Math.floor(Math.log10(v));
    const mantissa = v / Math.pow(10, exp);
    const supDigits = { &#x27;-&#x27;: &#x27;⁻&#x27;, &#x27;0&#x27;: &#x27;⁰&#x27;, &#x27;1&#x27;: &#x27;¹&#x27;, &#x27;2&#x27;: &#x27;²&#x27;, &#x27;3&#x27;: &#x27;³&#x27;, &#x27;4&#x27;: &#x27;⁴&#x27;, &#x27;5&#x27;: &#x27;⁵&#x27;, &#x27;6&#x27;: &#x27;⁶&#x27;, &#x27;7&#x27;: &#x27;⁷&#x27;, &#x27;8&#x27;: &#x27;⁸&#x27;, &#x27;9&#x27;: &#x27;⁹&#x27; };
    const sup = String(exp).split(&#x27;&#x27;).map(c =&gt; supDigits[c] ?? c).join(&#x27;&#x27;);
    return `${mantissa.toFixed(1)} × 10${sup} M`;
  }

  const guidanceByControl = {
    cell: {
      title: &#x27;Cell choice: theory&#x27;,
      text: &#x27;Each cell has its own standard potential, E&amp;deg;, and its own reaction quotient, &lt;em&gt;Q&lt;/em&gt;, built from the species in that cell\&#x27;s half-reactions. Changing cells changes the line\&#x27;s intercept (E&amp;deg;) and the meaning of the x-axis.&#x27;
    },
    zn: {
      title: &#x27;[Zn²⁺]: theory&#x27;,
      text: &#x27;Zn²⁺ is a product of this cell reaction, so it sits on top of &lt;em&gt;Q&lt;/em&gt;. Increasing it increases &lt;em&gt;Q&lt;/em&gt;, moving right along the line and lowering the cell potential &amp;mdash; Le Chatelier-like reasoning applied to Q.&#x27;
    },
    ox: {
      title: &#x27;Oxidant concentration: theory&#x27;,
      text: &#x27;The oxidant (Cu²⁺ or Ag⁺) is consumed by this cell reaction, so it sits on the bottom of &lt;em&gt;Q&lt;/em&gt;. Decreasing it increases &lt;em&gt;Q&lt;/em&gt;, moving right along the line and lowering the cell potential.&#x27;
    }
  };

  function defaultGuidance() {
    return {
      title: &#x27;Current graph: theory&#x27;,
      text: &#x27;E = E&amp;deg; &amp;minus; (0.0592/&lt;em&gt;n&lt;/em&gt;)log&lt;sub&gt;10&lt;/sub&gt;&lt;em&gt;Q&lt;/em&gt; at 25&amp;nbsp;&amp;deg;C. This is a straight line in log&lt;sub&gt;10&lt;/sub&gt;&lt;em&gt;Q&lt;/em&gt;: intercept E&amp;deg; at &lt;em&gt;Q&lt;/em&gt; = 1, slope &amp;minus;0.0592/&lt;em&gt;n&lt;/em&gt; volts per decade.&#x27;
    };
  }

  function showGuidance(topic) {
    const content = guidanceByControl[topic] || defaultGuidance();
    guidanceTitle.textContent = content.title;
    guidance.innerHTML = content.text;
  }

  function restoreGuidance() {
    activeGuidance = null;
    showGuidance();
  }

  function cellPotential(e0, n, logQ) {
    return e0 - (0.0592 / n) * logQ;
  }

  function render() {
    const cellKey = cellSelect.value;
    const cell = CELLS[cellKey];
    const znLog = Number(znInput.value);
    const oxLog = Number(oxInput.value);
    const zn = Math.pow(10, znLog);
    const ox = Math.pow(10, oxLog);
    outputs.zn.textContent = formatConc(zn);
    outputs.ox.textContent = formatConc(ox);
    oxLabel.childNodes[0].textContent = cell.oxLabel + &#x27; &#x27;;

    const logQ = znLog - cell.oxCoeff * oxLog;

    const bounds = root.querySelector(&#x27;.nq-chart-wrap&#x27;).getBoundingClientRect();
    const width = Math.max(320, Math.floor(bounds.width));
    const height = width &lt; 430 ? 360 : 440;
    const margin = { top: 70, right: 42, bottom: 76, left: 86 };
    const compact = width &lt; 500;

    const xs = d3.range(N + 1).map(i =&gt; LOGQ_MIN + i * (LOGQ_MAX - LOGQ_MIN) / N);
    const current = xs.map(x =&gt; ({ x, y: cellPotential(cell.e0, cell.n, x) }));
    const yAtEnds = [cellPotential(cell.e0, cell.n, LOGQ_MIN), cellPotential(cell.e0, cell.n, LOGQ_MAX)];
    const yMin = Math.min(...yAtEnds, cell.e0) - 0.15;
    const yMax = Math.max(...yAtEnds, cell.e0) + 0.15;

    const x = d3.scaleLinear().domain([LOGQ_MIN, LOGQ_MAX]).range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain([yMin, yMax]).range([height - margin.bottom, margin.top]);
    const line = d3.line().x(d =&gt; x(d.x)).y(d =&gt; y(d.y));
    chart.attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;preserveAspectRatio&#x27;, &#x27;xMidYMid meet&#x27;);
    chart.selectAll(&#x27;*&#x27;).remove();
    chart.append(&#x27;title&#x27;).attr(&#x27;id&#x27;, &#x27;nq-chart-title&#x27;).text(&#x27;Cell potential against log of the reaction quotient&#x27;);
    chart.append(&#x27;desc&#x27;).attr(&#x27;id&#x27;, &#x27;nq-chart-desc&#x27;).text(&#x27;A straight declining line showing cell potential as a function of log base ten of the reaction quotient Q, per the Nernst equation. A marker shows the current condition and an open circle marks standard conditions where Q equals one.&#x27;);
    chart.append(&#x27;rect&#x27;).attr(&#x27;class&#x27;, &#x27;nq-frame&#x27;).attr(&#x27;x&#x27;, margin.left).attr(&#x27;y&#x27;, margin.top).attr(&#x27;width&#x27;, width - margin.left - margin.right).attr(&#x27;height&#x27;, height - margin.top - margin.bottom);

    const cellLabel = compact ? `Zn/${cell.oxName}, E°=${cell.e0.toFixed(2)} V` : `Zn | Zn²⁺ ∥ ${cell.oxName} cell, E° = ${cell.e0.toFixed(2)} V`;
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;nq-direct-label&#x27;).attr(&#x27;x&#x27;, margin.left).attr(&#x27;y&#x27;, 29).text(cellLabel);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;nq-direct-label&#x27;).attr(&#x27;x&#x27;, margin.left).attr(&#x27;y&#x27;, 50).text(cell.qLabel);

    chart.append(&#x27;path&#x27;).datum(current).attr(&#x27;class&#x27;, &#x27;nq-current&#x27;).attr(&#x27;d&#x27;, line);

    const stdY = cellPotential(cell.e0, cell.n, 0);
    chart.append(&#x27;circle&#x27;).attr(&#x27;class&#x27;, &#x27;nq-standard&#x27;).attr(&#x27;cx&#x27;, x(0)).attr(&#x27;cy&#x27;, y(stdY)).attr(&#x27;r&#x27;, 5);

    const curE = cellPotential(cell.e0, cell.n, logQ);
    const clampedLogQ = Math.min(Math.max(logQ, LOGQ_MIN), LOGQ_MAX);
    chart.append(&#x27;line&#x27;).attr(&#x27;class&#x27;, &#x27;nq-guide&#x27;).attr(&#x27;x1&#x27;, x(clampedLogQ)).attr(&#x27;x2&#x27;, x(clampedLogQ)).attr(&#x27;y1&#x27;, margin.top).attr(&#x27;y2&#x27;, height - margin.bottom);
    chart.append(&#x27;circle&#x27;).attr(&#x27;class&#x27;, &#x27;nq-marker&#x27;).attr(&#x27;cx&#x27;, x(clampedLogQ)).attr(&#x27;cy&#x27;, y(cellPotential(cell.e0, cell.n, clampedLogQ))).attr(&#x27;r&#x27;, 6);

    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;nq-axis&#x27;).attr(&#x27;transform&#x27;, `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(width &lt; 430 ? 4 : 6));
    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;nq-axis&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(6));
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;nq-axis-title&#x27;).attr(&#x27;x&#x27;, (margin.left + width - margin.right) / 2).attr(&#x27;y&#x27;, height - 14).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;log₁₀ Q&#x27;);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;nq-axis-title&#x27;).attr(&#x27;transform&#x27;, `translate(21 ${(margin.top + height - margin.bottom) / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Cell potential, E (V)&#x27;);

    const direction = curE &lt; cell.e0 ? &#x27;below&#x27; : curE &gt; cell.e0 ? &#x27;above&#x27; : &#x27;equal to&#x27;;
    status.textContent = `Q ≈ ${logQ &gt;= -3 &amp;&amp; logQ &lt;= 3 ? Math.pow(10, logQ).toPrecision(3) : `10^${logQ.toFixed(1)}`}, log₁₀Q ≈ ${logQ.toFixed(2)}. E ≈ ${curE.toFixed(3)} V — ${direction} E° (${cell.e0.toFixed(2)} V).`;
    if (!activeGuidance) showGuidance();
  }

  [cellSelect, znInput, oxInput].forEach(control =&gt; control.addEventListener(&#x27;input&#x27;, render));
  const controlsWithGuidance = [[cellSelect, &#x27;cell&#x27;], [znInput, &#x27;zn&#x27;], [oxInput, &#x27;ox&#x27;]];
  controlsWithGuidance.forEach(([control, topic]) =&gt; {
    const label = control.closest(&#x27;label&#x27;);
    label.addEventListener(&#x27;mouseenter&#x27;, () =&gt; { activeGuidance = topic; showGuidance(topic); });
    label.addEventListener(&#x27;mouseleave&#x27;, restoreGuidance);
    control.addEventListener(&#x27;focus&#x27;, () =&gt; { activeGuidance = topic; showGuidance(topic); });
    control.addEventListener(&#x27;blur&#x27;, restoreGuidance);
  });
  new ResizeObserver(render).observe(root.querySelector(&#x27;.nq-chart-wrap&#x27;));
  render();
})();
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;
"></iframe>
